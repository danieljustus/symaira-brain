[package]
name = "symbrain-mcp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
serde_json = "1.0.145"
symbrain-mcp = { version = "0.11.0", path = "../rust/symbrain-mcp" }

[[bin]]
name = "frame-decoder"
path = "fuzz_targets/frame_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jsonrpc-envelope"
path = "fuzz_targets/jsonrpc_envelope.rs"
test = false
doc = false
bench = false

[workspace]
