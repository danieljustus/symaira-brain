[package]
name = "symbrain-usage"
description = "Native AI provider usage reporting for Symaira Brain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rusqlite = { workspace = true, features = ["hooks"] }
# Existing locked, validated Ed25519 implementation; never implement signing locally.
ring = "=0.17.14"
base64 = "=0.22.1"
cap-std.workspace = true
chrono.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
rustix.workspace = true
tempfile.workspace = true
toml_edit.workspace = true
ureq.workspace = true
regex.workspace = true

# Go uses GetComputerNameExW, not the overridable COMPUTERNAME environment value.
# This safe wrapper keeps platform FFI outside the usage crate.
[target.'cfg(windows)'.dependencies]
hostname = "=0.4.2"

[dev-dependencies]
sha2.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
