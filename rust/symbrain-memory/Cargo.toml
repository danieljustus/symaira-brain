[package]
name = "symbrain-memory"
description = "Native embedded memory and activity SQLite store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
sha2.workspace = true
# Same pinned crate the guard workspace already uses; needed to generate
# UUID-shaped memory ids like the shipped store.
getrandom = "=0.3.3"
symaira-core-llm.workspace = true
symbrain-activity.workspace = true
# Concrete sync backends. Existing pinned HTTP/JSON/entropy crates are reused;
# reviewed RustCrypto primitives replace Go crypto, never a handwritten KDF.
ureq = { workspace = true, features = ["platform-verifier", "gzip"] }
base64 = "=0.22.1"
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
hmac = "=0.12.1"
zeroize = "=1.9.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
