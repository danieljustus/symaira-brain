[package]
name = "symbrain-memory"
description = "Native embedded memory and activity SQLite store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Existing locked codecs/HTTP runtime; one bounded native memory HTTP owner.
base64 = "=0.22.1"
hmac = "=0.12.1"
zeroize = "=1.9.0"
hyper = { version = "=1.11.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
percent-encoding = "=2.3.2"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "time", "signal", "sync", "macros"] }
chrono.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
sha2.workspace = true
# Same pinned crate the guard workspace already uses; needed to generate
# UUID-shaped memory ids like the shipped store.
getrandom = "=0.3.3"
symaira-core-llm.workspace = true
symbrain-activity.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
