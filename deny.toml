[graph]
all-features = true

[advisories]
ignore = [
    # RUSTSEC-2026-0543: `chrono` is unmaintained and no fixed version exists.
    # Tracked in issue #1091; remove this entry when chrono is migrated to `time`.
    # Keep in sync with .cargo/audit.toml.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no fixed version; migrate to time (#1091)" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# libfuzzer-sys bundles LLVM's libFuzzer (NCSA). It is only linked into the
# fuzz/ workspace, which is never built into a shipped binary.
exceptions = [
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/danieljustus/symaira-corekit"]
