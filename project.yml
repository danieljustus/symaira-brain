name: SymBrain
options:
  bundleIdPrefix: com.symaira
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "26.0"
  fileTypes:
    "icon":
      file: true
  generateEmptyDirectories: false

# Pin the shared AppKit dependency (symaira-corekit) to an exact released version for reproducible builds.
packages:
  symaira-corekit:
    url: https://github.com/danieljustus/symaira-corekit.git
    exactVersion: 0.20.0

targets:
  SymBrainCore:
    type: library.static
    platform: macOS
    sources:
      - Sources/SymBrainCore
    dependencies:
      - package: symaira-corekit
        product: SymairaTheme
      - package: symaira-corekit
        product: SymairaCLIRunner
      - package: symaira-corekit
        product: SymairaToolKit
      - package: symaira-corekit
        product: SymairaDaemonKit
      - package: symaira-corekit
        product: SymairaUpdateCheck
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"

  SymBrain:
    type: application
    platform: macOS
    sources:
      - Sources/SymBrainApp
      - path: assets/app-icon/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - target: SymBrainCore
      - package: symaira-corekit
        product: SymairaTheme
      - package: symaira-corekit
        product: SymairaCLIRunner
      - package: symaira-corekit
        product: SymairaToolKit
      - package: symaira-corekit
        product: SymairaDaemonKit
      - package: symaira-corekit
        product: SymairaUpdateCheck
    settings:
      base:
        INFOPLIST_FILE: Sources/SymBrainApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.symaira.brain
        PRODUCT_NAME: Symaira Brain
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        MARKETING_VERSION: "0.14.0"
        CURRENT_PROJECT_VERSION: "1"

  SymBrainCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/SymBrainCoreTests
    dependencies:
      - target: SymBrainCore
      - package: symaira-corekit
        product: SymairaTheme
      - package: symaira-corekit
        product: SymairaCLIRunner
      - package: symaira-corekit
        product: SymairaToolKit
      - package: symaira-corekit
        product: SymairaDaemonKit
      - package: symaira-corekit
        product: SymairaUpdateCheck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"

  SymBrainMobile:
    type: application
    platform: iOS
    sources:
      - Sources/SymBrainMobile
      - path: assets/app-icon/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: symaira-corekit
        product: SymairaTheme
      - package: symaira-corekit
        product: SymairaToolKit
    settings:
      base:
        INFOPLIST_FILE: Sources/SymBrainMobile/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.symaira.brain.mobile
        PRODUCT_NAME: Symaira Brain
        PRODUCT_MODULE_NAME: SymBrainMobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.14.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  SymBrain:
    build:
      targets:
        SymBrain: all
    run:
      config: Debug
      environmentVariables:
        CI: "$(CI)"
        SYMAIRA_EXTERNAL_RUNTIME_ROOT: "$(SYMAIRA_EXTERNAL_RUNTIME_ROOT)"
    test:
      config: Debug
      targets:
        - SymBrainCoreTests

  SymBrainCore:
    build:
      targets:
        SymBrainCore: all
    run:
      config: Debug
      environmentVariables:
        CI: "$(CI)"
        SYMAIRA_EXTERNAL_RUNTIME_ROOT: "$(SYMAIRA_EXTERNAL_RUNTIME_ROOT)"
    test:
      config: Debug
      targets:
        - SymBrainCoreTests

  SymBrainCoreContract:
    build:
      targets:
        SymBrainCore: all
    test:
      config: Debug
      targets:
        - SymBrainCoreTests
      environmentVariables:
        HOME: "$(SYMBRAIN_CONTRACT_HOME)"
        XDG_CONFIG_HOME: "$(SYMBRAIN_CONTRACT_XDG_CONFIG_HOME)"
        SYMBRAIN_TEST_BINARY: "$(SYMBRAIN_CONTRACT_BINARY)"

  SymBrainMobile:
    build:
      targets:
        SymBrainMobile: all
    run:
      config: Debug
