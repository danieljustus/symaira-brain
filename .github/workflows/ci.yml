name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fail if any action is referenced by mutable tag instead of SHA.
  # Keeps the supply-chain surface small — tag moves are caught here.
  pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for unpinned actions
        run: |
          matches=$(grep -rn '^\s*uses:' .github/workflows/ --include='*.yml' \
            | grep -v '@[0-9a-f]\{40\}' || true)
          if [ -n "$matches" ]; then
            echo "::error::Unpinned action references found (use SHA, not tag):"
            echo "$matches"
            exit 1
          fi
          echo "All actions are pinned to SHA."

  # golangci-lint has a known incompatibility with Go 1.26 in this
  # ecosystem (see symaira-scope). gofmt + go vet below are the lint gate
  # until golangci-lint ships a Go-1.26-compatible release — re-enable a
  # dedicated lint job at that point.
  build-test:
    runs-on: ubuntu-latest
    env:
      # Default-path tests intentionally exercise the HOME fallback; keep
      # runner-level XDG configuration from redirecting their fixtures.
      XDG_CONFIG_HOME: ""
      XDG_DATA_HOME: ""
      XDG_CACHE_HOME: ""
      XDG_STATE_HOME: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint (go vet + gofmt check, matches local make lint)
        run: make lint

      # symbrain ships CGO-free; verify that build configuration explicitly.
      - name: Build (CGO-free)
        run: go build ./...
        env:
          CGO_ENABLED: "0"

      # -race requires cgo, so this step deliberately does not set
      # CGO_ENABLED=0 (unlike the build step above). The coverprofile and
      # test log are uploaded so the coverage job can build its artifacts
      # without running the suite a second time.
      - name: Test (race detector)
        shell: bash
        run: |
          set -euo pipefail
          # Tests use default XDG paths in several packages; serialize package
          # processes so those test fixtures cannot share one SQLite database.
          go test -race -shuffle=on -short -p 1 -coverprofile=coverage.out ./... 2>&1 | tee test.log

      - name: Upload coverage inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-input-${{ github.sha }}
          path: |
            coverage.out
            test.log
          retention-days: 1

  # Keep the incremental Rust entrypoint green while Go remains the oracle.
  rust-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Oracle generators verify the pinned rollback baseline.
          fetch-depth: 0

      - name: Set up Go oracle
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install pinned Rust audit tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked

      - name: Rust quality and Go parity gates
        run: make rust-check parity-smoke

      # Keep the protocol subprocess contract visible and independently
      # executable. `rust-check` already covers this test, but a named gate
      # prevents stdout/lifecycle regressions from disappearing inside a
      # workspace-wide test log.
      - name: Rust MCP stdio and lifecycle gate
        run: cargo test -p symbrain-cli --test mcp_cli_tests --locked

  # The migration's Rust CLI contains filesystem, process, and stdio paths
  # whose macOS behavior cannot be established by Linux CI or cross-builds.
  # Windows remains explicitly tracked in the contract matrix until the
  # portable Go-oracle launcher and native runner coverage are available.
  rust-migration-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Oracle generators verify the pinned rollback baseline.
          fetch-depth: 0

      - name: Set up Go oracle
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install pinned Rust audit tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked

      - name: Rust quality and Go parity gates on macOS
        run: make rust-check parity-smoke

      - name: Rust MCP stdio and lifecycle gate on macOS
        run: cargo test -p symbrain-cli --test mcp_cli_tests --locked

  # Stdio hygiene gate: `symbrain mcp` must emit nothing but JSON-RPC
  # frames on stdout across startup, tools/list, a failing tools/call and
  # shutdown (fake children). A dedicated job so a transport-breaking
  # regression is visible by name, not buried in the unit-test log.
  stdio-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Stdio hygiene gate
        run: go test -race -count=1 -run TestStdioHygiene ./cmd/symbrain/

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Pin the action to the v1.0.4 commit because the tag depends on deprecated action versions.
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.0.4
        with:
          go-version-file: go.mod
          repo-checkout: false
          go-package: ./...

  # Native package acceptance for the optional Scope intake. This is separate
  # from the GUI job: it builds and tests both packages and exercises the
  # checked-in executable over its real MCP stdio transport. It runs for real
  # Scope/history changes on PRs and main pushes, and unconditionally on the
  # scheduled/full-main and manually dispatched suites.
  scope-native-swiftpm:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect Scope package changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq '^(scope/|history/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve installed Xcode and Swift toolchain
        if: steps.scope.outputs.changed == 'true'
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Build history package
        if: steps.scope.outputs.changed == 'true'
        working-directory: history
        run: swift build --scratch-path "$RUNNER_TEMP/scope-history-build"

      - name: Test history package
        if: steps.scope.outputs.changed == 'true'
        working-directory: history
        run: swift test --scratch-path "$RUNNER_TEMP/scope-history-build"

      - name: Build Scope package and executable
        if: steps.scope.outputs.changed == 'true'
        working-directory: scope
        run: swift build --scratch-path "$RUNNER_TEMP/scope-package-build"

      - name: Test Scope package
        if: steps.scope.outputs.changed == 'true'
        working-directory: scope
        run: swift test --scratch-path "$RUNNER_TEMP/scope-package-build"

      - name: Verify CLI version output and stderr hygiene
        if: steps.scope.outputs.changed == 'true'
        working-directory: scope
        run: |
          set -euo pipefail
          bin="$(swift build --scratch-path "$RUNNER_TEMP/scope-package-build" --show-bin-path)/symscope"
          test -x "$bin"
          "$bin" version --json >"$RUNNER_TEMP/symscope-version.json" 2>"$RUNNER_TEMP/symscope-version.stderr"
          test ! -s "$RUNNER_TEMP/symscope-version.stderr"
          python3 - "$RUNNER_TEMP/symscope-version.json" <<'PY'
          import json
          import pathlib
          import sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert value["tool"] == "symscope"
          assert value["version"]
          assert value["schema_version"] == 1
          PY

      - name: Verify native MCP initialize and seven-tool catalog
        if: steps.scope.outputs.changed == 'true'
        working-directory: scope
        run: |
          set -euo pipefail
          bin="$(swift build --scratch-path "$RUNNER_TEMP/scope-package-build" --show-bin-path)/symscope"
          python3 - "$bin" <<'PY'
          import json
          import subprocess
          import sys

          proc = subprocess.Popen([sys.argv[1], "serve"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          assert proc.stdin and proc.stdout and proc.stderr
          initialize_request = {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18", "capabilities": {}, "clientInfo": {"name": "ci", "version": "1"}}}
          proc.stdin.write(json.dumps(initialize_request, separators=(',', ':')).encode() + b"\\n")
          proc.stdin.flush()
          initialize = json.loads(proc.stdout.readline())
          proc.stdin.write(b'{"jsonrpc":"2.0","method":"notifications/initialized"}\\n')
          proc.stdin.write(b'{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}\\n')
          proc.stdin.flush()
          tools_response = json.loads(proc.stdout.readline())
          proc.stdin.close()
          proc.wait(timeout=15)
          assert proc.returncode == 0, proc.returncode
          stderr = proc.stderr.read()
          assert not stderr, stderr.decode()
          assert initialize["result"]["serverInfo"]["name"] == "symscope"
          assert initialize["result"]["serverInfo"]["version"]
          tools = tools_response["result"]["tools"]
          names = [tool["name"] for tool in tools]
          assert names == ["scan", "ports_list", "ports_suggest", "mcp_list", "conflicts", "mcp_health", "daemons_list"], names
          print("MCP initialize OK; tools/list OK: " + ", ".join(names))
          PY

  # jobs above run on ubuntu-latest and never exercise xcodebuild, so a
  # Swift compile error or a failing SymBrainCoreTests used to surface only
  # at release time (precedent: v0.5.1 GUI release-asset failure, #212,
  # fixed by #215). Path-filtered inside the job so Go-only PRs do not pay
  # macOS runner cost, while the check itself always reports so it can be
  # required by the main protection ruleset.
  gui:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify Xcode 26 toolchain
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version | sed -n '1p')"
          echo "$XCODE_VERSION"
          case "$XCODE_VERSION" in
            Xcode\ 26.*|Xcode\ 27.*) ;;
            *) echo "::error::Expected Xcode 26 or newer, got: $XCODE_VERSION"; exit 1 ;;
          esac

      - name: Detect Swift-related changes
        id: swift
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "${BASE_SHA:-}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | \
             grep -Eq '^(Sources/|Tests/|project\.yml|SymBrain\.xcodeproj/|assets/app-icon/|scripts/check-app-icons\.sh$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Same local-path-to-URL patch release.yml applies: harmless no-op
      # while project.yml pins a URL + exactVersion, but keeps CI working
      # if a local path ever gets committed by accident.
      - name: Patch project.yml for CI (replace local path dependency with pinned URL)
        if: steps.swift.outputs.changed == 'true'
        run: |
          perl -i'' -pe "s|path: ../symaira-appkit|url: https://github.com/danieljustus/symaira-appkit\\nexactVersion: 0.6.0|" project.yml

      - name: Install XcodeGen
        if: steps.swift.outputs.changed == 'true'
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        if: steps.swift.outputs.changed == 'true'
        run: xcodegen generate

      - name: Verify native AppIcon sources
        if: steps.swift.outputs.changed == 'true'
        run: bash scripts/check-app-icons.sh

      - name: Build SymBrain app
        if: steps.swift.outputs.changed == 'true'
        run: |
          xcodebuild -project SymBrain.xcodeproj \
            -scheme SymBrain \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SymBrain-macos-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify compiled macOS AppIcon
        if: steps.swift.outputs.changed == 'true'
        run: bash scripts/check-app-icons.sh --bundle "$RUNNER_TEMP/SymBrain-macos-derived-data/Build/Products/Debug/Symaira Brain.app" --platform macOS

      - name: Build and test SymBrainCore
        if: steps.swift.outputs.changed == 'true'
        run: |
          xcodebuild -project SymBrain.xcodeproj \
            -scheme SymBrainCore \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SymBrain-macos-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build test

      - name: Resolve pinned iOS simulator
        if: steps.swift.outputs.changed == 'true'
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,re,sys; data=json.load(sys.stdin); cands=sorted(((int(m.group(1)), d['udid']) for lst in data['devices'].values() for d in lst for m in [re.fullmatch(r'iPhone (\\d+)', d['name'])] if m), reverse=True); print(cands[0][1]) if cands else sys.exit(1)")
          test -n "$UDID" || { echo "::error::No available plain iPhone simulator found"; xcrun simctl list devices available; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build SymBrainMobile
        if: steps.swift.outputs.changed == 'true'
        run: |
          xcodebuild -project SymBrain.xcodeproj \
            -scheme SymBrainMobile \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/SymBrain-ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify compiled iOS AppIcon
        if: steps.swift.outputs.changed == 'true'
        run: bash scripts/check-app-icons.sh --bundle "$RUNNER_TEMP/SymBrain-ios-derived-data/Build/Products/Debug-iphonesimulator/Symaira Brain.app" --platform iOS

  # Validates .goreleaser.yml on every push/PR, not only at tag time, so a
  # broken release config is caught long before a real release tag is
  # pushed. Runs the real build/archive/checksum/SBOM pipeline a release
  # would (--snapshot skips publishing); signing is skipped here because it
  # needs the tag-triggered release workflow's ambient OIDC token, which a
  # plain push/PR run does not have.
  goreleaser-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: goreleaser release --snapshot --clean
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=sign

  coverage:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Reuses the coverprofile + test log from the build-test job instead
      # of re-running the suite (make coverage honors COVERAGE_PROFILE /
      # COVERAGE_LOG and skips go test when both are set).
      - name: Download coverage inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-input-${{ github.sha }}

      - name: Generate coverage artifacts
        run: make coverage
        env:
          COVERAGE_PROFILE: coverage.out
          COVERAGE_LOG: test.log

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage.json
            badge.json
            badge.svg

  # coverage-data is a persistent orphan data branch, not a source branch.
  # Repository settings must exempt it from branch cleanup and either leave
  # it unprotected or grant this job the bypass needed for its force update.
  # The workflow intentionally never deletes the branch.
  publish-coverage-data:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-${{ github.sha }}
          path: /tmp/coverage-artifacts/

      - name: Publish coverage-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Verify artifacts are available before switching branches
          ls /tmp/coverage-artifacts/coverage.json /tmp/coverage-artifacts/badge.json /tmp/coverage-artifacts/badge.svg >/dev/null 2>&1 || {
            echo "ERROR: coverage artifacts not found in /tmp/coverage-artifacts/"
            ls -la /tmp/coverage-artifacts/ 2>/dev/null || echo "  (directory does not exist)"
            exit 1
          }
          git checkout --orphan coverage-data
          git rm -rf . 2>/dev/null || true
          cp /tmp/coverage-artifacts/* .
          git add coverage.json badge.json badge.svg
          git commit -m "ci: publish coverage for $GITHUB_SHA"
          git push origin HEAD:coverage-data --force
