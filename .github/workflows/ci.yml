name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fail if any action is referenced by mutable tag instead of SHA.
  # Keeps the supply-chain surface small — tag moves are caught here.
  pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for unpinned actions
        run: |
          matches=$(grep -rn '^\s*uses:' .github/workflows/ --include='*.yml' \
            | grep -v '@[0-9a-f]\{40\}' || true)
          if [ -n "$matches" ]; then
            echo "::error::Unpinned action references found (use SHA, not tag):"
            echo "$matches"
            exit 1
          fi
          echo "All actions are pinned to SHA."

  # golangci-lint has a known incompatibility with Go 1.26 in this
  # ecosystem (see symaira-scope). gofmt + go vet below are the lint gate
  # until golangci-lint ships a Go-1.26-compatible release — re-enable a
  # dedicated lint job at that point.
  # Lint and CGO-free build stay their own job so they can start immediately;
  # the race suite below runs as parallel shards (see build-test).
  go-lint-build:
    runs-on: ubuntu-latest
    env:
      # Default-path tests intentionally exercise the HOME fallback; keep
      # runner-level XDG configuration from redirecting their fixtures.
      XDG_CONFIG_HOME: ""
      XDG_DATA_HOME: ""
      XDG_CACHE_HOME: ""
      XDG_STATE_HOME: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint (go vet + gofmt check, matches local make lint)
        run: make lint

      # symbrain ships CGO-free; verify that build configuration explicitly.
      - name: Build (CGO-free)
        run: go build ./...
        env:
          CGO_ENABLED: "0"

  # The Go race suite serializes package processes (`-p 1`) because several
  # packages use default XDG paths and would otherwise share one fixture
  # database. Serialization is a correctness requirement, so the wall clock is
  # cut by sharding across runners instead of relaxing the flag:
  # `scripts/ci-go-test-shards.sh` assigns every package exactly once, greedily
  # balanced by measured duration, and still runs the identical flags. -race
  # requires cgo, so these steps deliberately do not set CGO_ENABLED=0.
  go-test-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      XDG_CONFIG_HOME: ""
      XDG_DATA_HOME: ""
      XDG_CACHE_HOME: ""
      XDG_STATE_HOME: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test (race detector, shard ${{ matrix.shard }} of 4)
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci-go-test-shards.sh --run "${{ matrix.shard }}" 4 "${RUNNER_TEMP:-/tmp}/go-shard"

      - name: Upload shard coverage inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-input-${{ github.sha }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/go-shard/*
          retention-days: 1

  # Aggregate gate for the Go side: keeps the historical `build-test` check
  # name and rebuilds the single coverage-input artifact the coverage job
  # consumes, so sharding stays invisible to every other job and to the
  # coverage pipeline. Every package still runs exactly once with the same
  # flags; only the runner changed.
  build-test:
    needs: [go-lint-build, go-test-shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Download shard coverage inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-input-${{ github.sha }}-*
          path: ${{ runner.temp }}/go-shards
          merge-multiple: true

      - name: Merge shard coverage inputs
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci-go-test-shards.sh --merge 4 "${RUNNER_TEMP:-/tmp}/go-shards" .

      # The coverprofile and test log are uploaded so the coverage job can
      # build its artifacts without running the suite a second time.
      - name: Upload coverage inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-input-${{ github.sha }}
          path: |
            coverage.out
            test.log
          retention-days: 1

  # Keep the incremental Rust entrypoint green while Go remains the oracle.
  rust-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Oracle generators verify the pinned rollback baseline.
          fetch-depth: 0

      - name: Set up Go oracle
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust quality dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: rust-quality-install-meta-v2-${{ runner.os }}-${{ runner.arch }}-toolchain-${{ hashFiles('rust-toolchain.toml') }}-lock-${{ hashFiles('Cargo.lock') }}-audit-0.22.2-deny-0.20.2

      - name: Install pinned Rust audit tools
        shell: sh
        run: |
          set -eu
          audit_version="$(cargo-audit --version 2>/dev/null || true)"
          if [ "$audit_version" != "cargo-audit 0.22.2" ]; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
          deny_version="$(cargo-deny --version 2>/dev/null || true)"
          if [ "$deny_version" != "cargo-deny 0.20.2" ]; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi

      - name: Rust quality and Go parity gates
        run: make rust-check parity-smoke

      # Keep the protocol subprocess contract visible and independently
      # executable. `rust-check` already covers this test, but a named gate
      # prevents stdout/lifecycle regressions from disappearing inside a
      # workspace-wide test log.
      - name: Rust MCP stdio and lifecycle gate
        run: cargo test -p symbrain-cli --test mcp_cli_tests --locked

      # Compare the shipped Go and native Rust executables across raw MCP
      # frames, a hermetic stdio child, malformed frames, CLI failures and
      # SIGTERM while stdin remains open.
      - name: Go/Rust MCP executable differential gate
        run: |
          go build -o "$RUNNER_TEMP/symbrain-go-mcp" ./cmd/symbrain
          cargo build -p symbrain-cli --bin symbrain --locked
          python3 scripts/mcp-differential.py "$RUNNER_TEMP/symbrain-go-mcp" target/debug/symbrain

  # Keep raw invalid-UTF-8 diagnostics and persisted audit fields pinned to
  # the immutable Go 1.26.7 checkpoint using the real production binaries.
  # native_repair.py also checks the checked-in fixture byte-for-byte against
  # a fresh run from that archive; it never rewrites the fixture.
  guard-decide-raw-byte:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: false
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Independent Rust trust-anchor gate
        run: |
          cargo test --manifest-path Cargo.toml --locked -p symbrain-guard-core --test external_repair
          cargo test --manifest-path Cargo.toml --locked -p symbrain-cli --test guard_decide_raw_bytes
      - name: Execute raw-byte production-binary corpus
        env:
          GUARD_REPAIR_OUTPUT: ${{ runner.temp }}/guard-raw-byte
        run: python3 guard/scripts/guard-decide-oracle/native_repair.py
      - name: Retain raw-byte evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-raw-byte-${{ github.sha }}
          path: |
            ${{ runner.temp }}/guard-raw-byte/*.json
            ${{ runner.temp }}/guard-raw-byte/*.log
          if-no-files-found: error
          retention-days: 14

  # The migration's Rust CLI contains filesystem, process, and stdio paths
  # whose macOS behavior cannot be established by Linux CI or cross-builds.
  # Windows remains explicitly tracked in the contract matrix until the
  # portable Go-oracle launcher and native runner coverage are available.
  rust-migration-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Oracle generators verify the pinned rollback baseline.
          fetch-depth: 0

      - name: Set up Go oracle
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust quality dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: rust-quality-install-meta-v2-${{ runner.os }}-${{ runner.arch }}-toolchain-${{ hashFiles('rust-toolchain.toml') }}-lock-${{ hashFiles('Cargo.lock') }}-audit-0.22.2-deny-0.20.2

      - name: Install pinned Rust audit tools
        shell: sh
        run: |
          set -eu
          audit_version="$(cargo-audit --version 2>/dev/null || true)"
          if [ "$audit_version" != "cargo-audit 0.22.2" ]; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
          deny_version="$(cargo-deny --version 2>/dev/null || true)"
          if [ "$deny_version" != "cargo-deny 0.20.2" ]; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi

      - name: Rust quality and Go parity gates on macOS
        run: make rust-check parity-smoke

      - name: Rust MCP stdio and lifecycle gate on macOS
        run: cargo test -p symbrain-cli --test mcp_cli_tests --locked

  # Run the complete root Rust workspace and Go-derived fixture gates on the
  # native Windows target. The parity-smoke comparators receive explicit .exe
  # paths because the Makefile's convenience target uses Unix binary names.
  rust-migration-windows:
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go oracle
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install GNU Make
        run: choco install make --version=4.4.1 --yes --no-progress

      - name: Cache Rust quality dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin/cargo-audit.exe
            ~/.cargo/bin/cargo-deny.exe
          key: rust-quality-install-meta-v2-${{ runner.os }}-${{ runner.arch }}-toolchain-${{ hashFiles('rust-toolchain.toml') }}-lock-${{ hashFiles('Cargo.lock') }}-audit-0.22.2-deny-0.20.2

      - name: Install pinned Rust audit tools
        shell: bash
        run: |
          set -euo pipefail
          audit_version="$(cargo-audit --version 2>/dev/null || true)"
          if [ "$audit_version" != "cargo-audit 0.22.2" ]; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
          deny_version="$(cargo-deny --version 2>/dev/null || true)"
          if [ "$deny_version" != "cargo-deny 0.20.2" ]; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi

      - name: Generate native Windows oracle fixtures
        shell: bash
        run: |
          set -euo pipefail
          xdg_fixture="$RUNNER_TEMP/xdg-oracle-windows.json"
          doctor_fixture="$RUNNER_TEMP/guard-doctor-oracle-windows.json"
          instructions_fixture="$RUNNER_TEMP/instructions-oracle-windows.json"
          cli_fixture="$RUNNER_TEMP/cli-tree-oracle-windows.json"
          profile_remove_fixture="$RUNNER_TEMP/profile-remove-oracle-windows.json"
          skills_fixture="$RUNNER_TEMP/skills-oracle-windows.json"
          skills_install_fixture="$RUNNER_TEMP/skills-install-oracle-windows.json"
          cli_go_binary="$PWD/target/go/symbrain-go"
          ./scripts/run-go-oracle.sh HEAD run ./scripts/xdg-oracle -output "$xdg_fixture"
          ./scripts/run-go-oracle.sh HEAD run ./guard/scripts/guard-doctor-oracle -output "$doctor_fixture"
          ./scripts/run-go-oracle.sh HEAD run ./scripts/instructions-oracle -output "$instructions_fixture"
          mkdir -p "$(dirname "$cli_go_binary")"
          ./scripts/run-go-oracle.sh HEAD build -ldflags "-X main.version=dev" -o "$cli_go_binary" ./cmd/symbrain
          go_toolchain="$(awk '$1 == "go" { print "go" $2; exit }' go.mod)"
          GOTOOLCHAIN="$go_toolchain" CGO_ENABLED=0 go run ./scripts/cli-oracle -go-binary "$cli_go_binary" -output "$cli_fixture"
          ./scripts/run-go-oracle.sh HEAD run ./scripts/profile-remove-oracle -output "$profile_remove_fixture"
          ./scripts/run-go-oracle.sh HEAD run ./scripts/skills-oracle -output "$skills_fixture"
          ./scripts/run-go-oracle.sh HEAD run ./scripts/skills-install-oracle -output "$skills_install_fixture"
          scan_fixture="$RUNNER_TEMP/guard-scan-oracle-windows.json"
          SYMBRAIN_GUARD_SCAN_ORACLE_FIXTURE="$scan_fixture" ./guard/scripts/guard-scan-oracle/run.sh write
          echo "SYMBRAIN_XDG_ORACLE_FIXTURE=$xdg_fixture" >> "$GITHUB_ENV"
          echo "SYMBRAIN_GUARD_DOCTOR_ORACLE_FIXTURE=$doctor_fixture" >> "$GITHUB_ENV"
          echo "SYMBRAIN_INSTRUCTIONS_ORACLE_FIXTURE=$instructions_fixture" >> "$GITHUB_ENV"
          echo "SYMBRAIN_CLI_TREE_ORACLE_FIXTURE=$cli_fixture" >> "$GITHUB_ENV"
          echo "SYMBRAIN_PROFILE_REMOVE_ORACLE_FIXTURE=$profile_remove_fixture" >> "$GITHUB_ENV"
          echo "SYMBRAIN_SKILLS_ORACLE_FIXTURE=$skills_fixture" >> "$GITHUB_ENV"
          echo "SYMBRAIN_SKILLS_INSTALL_ORACLE_FIXTURE=$skills_install_fixture" >> "$GITHUB_ENV"
          echo "SYMBRAIN_GUARD_SCAN_ORACLE_FIXTURE=$scan_fixture" >> "$GITHUB_ENV"

      - name: Rust workspace and Go fixture gates on native Windows
        shell: bash
        run: make rust-check

      - name: Go/Rust executable parity on native Windows
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -ldflags "-X main.version=dev" -o "$RUNNER_TEMP/symbrain-go.exe" ./cmd/symbrain
          SYMBRAIN_VERSION=dev cargo build --workspace --locked
          ./guard/scripts/guard-scan-oracle/run.sh parity target/debug/symbrain.exe
          python3 scripts/rust-differential.py "$RUNNER_TEMP/symbrain-go.exe" target/debug/symbrain.exe

      - name: Rust MCP stdio subprocess tests on native Windows
        shell: bash
        run: cargo test -p symbrain-cli --test mcp_cli_tests --locked

      - name: Go/Rust MCP executable differential on native Windows
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/symbrain-go-mcp.exe" ./cmd/symbrain
          cargo build -p symbrain-cli --bin symbrain --locked
          python3 scripts/mcp-differential.py "$RUNNER_TEMP/symbrain-go-mcp.exe" target/debug/symbrain.exe

  rust-mcp-fuzz-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install nightly Rust and pinned cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz both MCP targets with retained Go seeds
        run: make rust-fuzz-smoke

  # Windows native audit capability and guard decide adapter test gate.
  # Exercises handle-relative directory capability, reparse-point rejection,
  # and guard decide adapter on native Windows runners.
  # Full migration acceptance remains open pending runtime evidence for all subsystems.
  rust-windows-audit-guard:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust test dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-audit-guard-v1-${{ runner.os }}-${{ runner.arch }}-toolchain-${{ hashFiles('rust-toolchain.toml') }}-lock-${{ hashFiles('Cargo.lock') }}

      - name: Test symbrain-audit crate on native Windows
        run: cargo test -p symbrain-audit --locked

      - name: Test guard decide adapter on native Windows
        run: cargo test -p symbrain-cli --test guard_decide_adapter --locked

  # Init is a production Rust path; run the genuine Go comparison on each OS.
  rust-init-native:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache Rust init dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-init-v1-${{ runner.os }}-${{ runner.arch }}-toolchain-${{ hashFiles('rust-toolchain.toml') }}-lock-${{ hashFiles('Cargo.lock') }}
      - name: Check native init formatting and lint
        if: ${{ matrix.os == 'windows-2025' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symbrain-cli --all-targets --all-features --locked -- -D warnings
      - name: Test skills home resolution on native Windows
        if: ${{ matrix.os == 'windows-2025' }}
        shell: bash
        run: |
          set -euo pipefail
          for case in \
            "symbrain-skills runner_env_tests conflicting_home_variables_use_the_go_platform_home" \
            "symbrain-skills runner_env_tests default_paths_match_the_go_oracle_for_every_resolution_branch" \
            "symbrain-skills model_security_tests missing_optional_overlay_trees_are_empty" \
            "symbrain-skills render_tests missing_optional_render_overlays_are_empty" \
            "symbrain-cli skills_sync_legacy_roots native_sync_plan_uses_the_platform_home_when_home_variables_disagree"; do
            read -r package suite name <<<"$case"
            output=$(cargo test -p "$package" --test "$suite" "$name" --locked -- --exact 2>&1) || { printf '%s\n' "$output"; exit 1; }
            printf '%s\n' "$output"
            [[ "$output" == *"test result: ok. 1 passed; 0 failed;"* ]]
          done
      - name: Test native Windows skill installation and reparse refusal
        if: ${{ matrix.os == 'windows-2025' }}
        shell: bash
        run: |
          set -euo pipefail
          for case in \
            "lib cap_root::tests::drive_and_unc_roots_preserve_their_volume" \
            "windows_roots drive_root_materializes_and_installs_real_skill" \
            "windows_roots junction_ancestors_are_refused_without_touching_outside"; do
            read -r suite name <<<"$case"
            if [[ "$suite" == lib ]]; then
              target=(--lib)
            else
              target=(--test "$suite")
            fi
            output=$(cargo test -p symbrain-skills "${target[@]}" "$name" --locked -- --exact 2>&1) || { printf '%s\n' "$output"; exit 1; }
            printf '%s\n' "$output"
            [[ "$output" == *"test result: ok. 1 passed; 0 failed;"* ]]
          done
      # Keep lint failures fatal, but collect independent runtime diagnostics.
      - name: Execute native init tests and Go differential
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symbrain-policy profile::create::tests --locked
          cargo test -p symbrain-cli --lib init_cli::tests --locked
          cargo test -p symbrain-cli --test init_cli_tests --locked
          cargo build -p symbrain-cli --locked
          python3 scripts/init-oracle/test_compare.py
          python3 scripts/init-oracle/compare.py --rust-binary "target/debug/symbrain${{ matrix.os == 'windows-2025' && '.exe' || '' }}" --output target/init-oracle/report.json
      - name: Test additional Rust contracts on native Windows
        if: ${{ matrix.os == 'windows-2025' && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          go run ./scripts/instructions-oracle -output "$RUNNER_TEMP/instructions-oracle-windows.json"
          go run ./scripts/adapters-oracle -output "$RUNNER_TEMP/adapters-oracle-windows.json"
          echo "SYMBRAIN_INSTRUCTIONS_ORACLE_FIXTURE=$RUNNER_TEMP/instructions-oracle-windows.json" >> "$GITHUB_ENV"
          echo "SYMBRAIN_ADAPTERS_ORACLE_FIXTURE=$RUNNER_TEMP/adapters-oracle-windows.json" >> "$GITHUB_ENV"
          export SYMBRAIN_INSTRUCTIONS_ORACLE_FIXTURE="$RUNNER_TEMP/instructions-oracle-windows.json"
          export SYMBRAIN_ADAPTERS_ORACLE_FIXTURE="$RUNNER_TEMP/adapters-oracle-windows.json"
          cargo test -p symbrain-instructions --test instruction_tests --locked
          cargo test -p symbrain-adapter --test adapter_tests --locked
          go run ./scripts/usage-oracle -check
          cargo test -p symbrain-usage --test usage_tests --locked
          cargo test -p symbrain-cli --lib usage_cli::tests --locked
      - name: Compare profile removal with the native Go CLI
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = windows-2025 ]; then
            go run ./scripts/profile-remove-oracle -output "$RUNNER_TEMP/profile_remove_oracle_windows.json"
            echo "SYMBRAIN_PROFILE_REMOVE_ORACLE_FIXTURE=$RUNNER_TEMP/profile_remove_oracle_windows.json" >> "$GITHUB_ENV"
            export SYMBRAIN_PROFILE_REMOVE_ORACLE_FIXTURE="$RUNNER_TEMP/profile_remove_oracle_windows.json"
          fi
          cargo test -p symbrain-cli --test profile_cli_tests --locked
          if [ "${{ matrix.os }}" != windows-2025 ]; then
            if ! go run ./scripts/profile-remove-oracle -check; then
              go run ./scripts/profile-remove-oracle -output "$RUNNER_TEMP/profile-remove-generated.json"
              diff -u "rust/symbrain-cli/tests/fixtures/profile_remove_oracle_$(go env GOOS).json" "$RUNNER_TEMP/profile-remove-generated.json" || true
              exit 1
            fi
          fi
          go run ./scripts/profile-remove-oracle --compare-rust "target/debug/symbrain${{ matrix.os == 'windows-2025' && '.exe' || '' }}"
      - name: Check gateway cancellation against native Go
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          go run ./scripts/mcp-oracle -check
          go run ./scripts/gateway-oracle -check
          CGO_ENABLED=0 go build -trimpath -o "target/mcp-go${{ matrix.os == 'windows-2025' && '.exe' || '' }}" ./cmd/symbrain
          cargo build -p symbrain-cli --locked
          python3 scripts/mcp-differential.py "target/mcp-go${{ matrix.os == 'windows-2025' && '.exe' || '' }}" "target/debug/symbrain${{ matrix.os == 'windows-2025' && '.exe' || '' }}"
          cargo test -p symbrain-mcp --locked
          cargo test -p symbrain-gateway --test gateway_tests --locked
          cargo test -p symbrain-broker --test broker_tests --locked
      - name: Check secret resolution against native Go
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          go run ./scripts/secret-oracle -check
          cargo test -p symbrain-usage --test secret_oracle_tests --locked
      # Named Go fixture gates for contract rows without a native Windows
      # oracle invocation elsewhere in this job. The workspace test below
      # executes the matching Rust package/test targets on the same runner.
      - name: Check portable CLI, config, policy, and data oracles on Windows
        if: ${{ matrix.os == 'windows-2025' && !cancelled() }}
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set -uo pipefail
          failed=0
          # CLI-006 and CFG-001 use native Go fixtures on Windows.
          go run ./scripts/xdg-oracle -output "$RUNNER_TEMP/xdg-oracle-windows.json"
          echo "SYMBRAIN_XDG_ORACLE_FIXTURE=$RUNNER_TEMP/xdg-oracle-windows.json" >> "$GITHUB_ENV"
          SYMBRAIN_XDG_ORACLE_FIXTURE="$RUNNER_TEMP/xdg-oracle-windows.json" cargo test -p symbrain-core --test xdg_paths_tests --locked || failed=1
          go run ./scripts/cli-oracle -output "$RUNNER_TEMP/cli_tree_windows.json" || failed=1
          echo "SYMBRAIN_CLI_TREE_ORACLE_FIXTURE=$RUNNER_TEMP/cli_tree_windows.json" >> "$GITHUB_ENV"
          SYMBRAIN_CLI_TREE_ORACLE_FIXTURE="$RUNNER_TEMP/cli_tree_windows.json" cargo test -p symbrain-cli --test cli_tree_tests --locked || failed=1
          # PRF-001, POL-001/002; CAT-001; AUD-001; PAT-001; ACT-001; DB-001/002.
          go run ./scripts/policy-oracle -check || failed=1
          go run ./scripts/catalog-oracle -check || failed=1
          go run ./scripts/audit-oracle -check || failed=1
          go run ./scripts/patterns-activity-oracle -check || failed=1
          go run ./scripts/db-memory-oracle -check || failed=1
          exit "$failed"
      - name: Check portable broker, managed, and harness oracles on Windows
        if: ${{ matrix.os == 'windows-2025' && !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          # BRK-001/002, MAN-001, ARC-001, HAR-001..006.
          go run ./scripts/broker-oracle -check || failed=1
          go test ./internal/broker -count=1 -timeout=90s || failed=1
          go test ./internal/managed -count=1 -timeout=90s || failed=1
          go test ./internal/harness -count=1 -timeout=90s || failed=1
          exit "$failed"
      - name: Check portable skills, instructions, adapters, and guard oracles on Windows
        if: ${{ matrix.os == 'windows-2025' && !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          # SKL-001..003; INS-001; ADR-005; SEC-002..005.
          go run ./scripts/skills-oracle -output "$RUNNER_TEMP/skills-oracle-windows.json" || failed=1
          go run ./scripts/skills-install-oracle -output "$RUNNER_TEMP/skills-install-oracle-windows.json" || failed=1
          go test ./internal/instructions -run TestWriteFileAtomicCreatesNestedParentAndLeavesNoTempFile -count=1 -timeout=60s || failed=1
          echo "SYMBRAIN_SKILLS_ORACLE_FIXTURE=$RUNNER_TEMP/skills-oracle-windows.json" >> "$GITHUB_ENV"
          echo "SYMBRAIN_SKILLS_INSTALL_ORACLE_FIXTURE=$RUNNER_TEMP/skills-install-oracle-windows.json" >> "$GITHUB_ENV"
          go run ./guard/scripts/guard-oracle -output "$RUNNER_TEMP/guard_oracle_windows.json" || failed=1
          go run ./guard/scripts/guard-doctor-oracle -output "$RUNNER_TEMP/guard_doctor_oracle_windows.json" || failed=1
          echo "SYMBRAIN_GUARD_ORACLE_FIXTURE=$RUNNER_TEMP/guard_oracle_windows.json" >> "$GITHUB_ENV"
          echo "SYMBRAIN_GUARD_DOCTOR_ORACLE_FIXTURE=$RUNNER_TEMP/guard_doctor_oracle_windows.json" >> "$GITHUB_ENV"
          exit "$failed"
      - name: Differential-test portable native Windows CLI cases
        if: ${{ matrix.os == 'windows-2025' && !cancelled() }}
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          go build -ldflags "-X main.version=dev" -o "$RUNNER_TEMP/symbrain-go.exe" ./cmd/symbrain
          cargo build -p symbrain-cli --locked
          python3 scripts/rust-differential.py "$RUNNER_TEMP/symbrain-go.exe" target/debug/symbrain.exe
      - name: Capture native Windows install oracle
        if: ${{ matrix.os == 'windows-2025' && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          go run ./scripts/install-oracle -check
          go run ./scripts/install-oracle -output "$RUNNER_TEMP/install_oracle_windows.json"
      - name: Report release-only rows awaiting signed artifacts
        if: ${{ matrix.os == 'windows-2025' && !cancelled() }}
        shell: bash
        run: echo "::notice::DIST-001 and DIST-002 are release-time contract rows; no current-release artifacts exist for pre-release native Windows Go/Rust differential evidence."
      - name: Test Rust workspace on native Windows
        if: ${{ matrix.os == 'windows-2025' && !cancelled() }}
        shell: bash
        run: cargo test --workspace --all-features --locked --no-fail-fast
      - name: Retain native init observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: init-${{ matrix.os }}-${{ github.sha }}
          path: |
            target/init-oracle/report.json
            ${{ runner.temp }}/instructions-oracle-windows.json
            ${{ runner.temp }}/adapters-oracle-windows.json
            ${{ runner.temp }}/skills-oracle-windows.json
            ${{ runner.temp }}/skills-install-oracle-windows.json
            ${{ runner.temp }}/xdg-oracle-windows.json
            ${{ runner.temp }}/cli_tree_windows.json
            ${{ runner.temp }}/profile_remove_oracle_windows.json
            ${{ runner.temp }}/install_oracle_windows.json
            ${{ runner.temp }}/guard_oracle_windows.json
            ${{ runner.temp }}/guard_doctor_oracle_windows.json
            target/init-oracle/go-bin/*-stderr.log
            target/init-oracle/go-bin/*-stdout.log
          retention-days: 14
          if-no-files-found: warn

  # Stdio hygiene gate: `symbrain mcp` must emit nothing but JSON-RPC
  # frames on stdout across startup, tools/list, a failing tools/call and
  # shutdown (fake children). A dedicated job so a transport-breaking
  # regression is visible by name, not buried in the unit-test log.
  stdio-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Stdio hygiene gate
        run: go test -race -count=1 -run TestStdioHygiene ./cmd/symbrain/

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Pin the action to the v1.0.4 commit because the tag depends on deprecated action versions.
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.0.4
        with:
          go-version-file: go.mod
          repo-checkout: false
          go-package: ./...

  # Native package acceptance for the optional Scope intake. This is separate
  # from the GUI job: it builds and tests both packages and exercises the
  # checked-in executable over its real MCP stdio transport. It runs for real
  # Scope/history changes on PRs and main pushes, and unconditionally on the
  # scheduled/full-main and manually dispatched suites.
  scope-native-swiftpm:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 15
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect Scope package changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq '^(scope/|history/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve installed Xcode and Swift toolchain
        if: steps.scope.outputs.changed == 'true'
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Build history package
        if: steps.scope.outputs.changed == 'true'
        working-directory: history
        run: swift build --scratch-path "$RUNNER_TEMP/scope-history-build"

      - name: Test history package
        if: steps.scope.outputs.changed == 'true'
        working-directory: history
        run: swift test --scratch-path "$RUNNER_TEMP/scope-history-build"

      - name: Build Scope package and executable
        if: steps.scope.outputs.changed == 'true'
        working-directory: scope
        run: swift build --scratch-path "$RUNNER_TEMP/scope-package-build"

      - name: Test Scope package
        if: steps.scope.outputs.changed == 'true'
        working-directory: scope
        run: swift test --scratch-path "$RUNNER_TEMP/scope-package-build"

      - name: Verify CLI version output and stderr hygiene
        if: steps.scope.outputs.changed == 'true'
        working-directory: scope
        run: |
          set -euo pipefail
          bin="$(swift build --scratch-path "$RUNNER_TEMP/scope-package-build" --show-bin-path)/symscope"
          test -x "$bin"
          "$bin" version --json >"$RUNNER_TEMP/symscope-version.json" 2>"$RUNNER_TEMP/symscope-version.stderr"
          test ! -s "$RUNNER_TEMP/symscope-version.stderr"
          python3 - "$RUNNER_TEMP/symscope-version.json" <<'PY'
          import json
          import pathlib
          import sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert value["tool"] == "symscope"
          assert value["version"]
          assert value["schema_version"] == 1
          PY

      - name: Verify native MCP initialize and seven-tool catalog
        if: steps.scope.outputs.changed == 'true'
        working-directory: scope
        run: |
          set -euo pipefail
          bin="$(swift build --scratch-path "$RUNNER_TEMP/scope-package-build" --show-bin-path)/symscope"
          test -x "$bin"
          python3 ../scripts/scope-mcp-smoke.py "$bin" --timeout 10
          python3 ../scripts/scope-mcp-smoke.py --self-test

  # Native package acceptance for the optional Operate intake (PB-2026-09-09
  # package 3, source-intake stage only — see operate/SOURCE_PROVENANCE.md).
  # Deliberately narrower than scope-native-swiftpm: Operate's own test
  # targets (SymOperateCoreTests, SymOperateSmokeTests) exercise real
  # ScreenCaptureKit/Accessibility APIs even with permission-denied fallbacks
  # written in, and the operator brief for this package requires "controlled
  # fixture apps only; no live desktop automation as a migration smoke test."
  # Compile every test target, but execute only PermissionServiceTests,
  # whose injected probes never invoke native TCC or open System Settings.
  # Also exercise the
  # MCP transport with initialize/tools-list only, never tools/call.
  operate-native-swiftpm:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 15
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect Operate package changes
        id: operate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq '^(operate/|history/|scripts/operate-mcp-smoke\.py$|\.github/workflows/ci\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve installed Xcode and Swift toolchain
        if: steps.operate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Build history package
        if: steps.operate.outputs.changed == 'true'
        working-directory: history
        run: swift build --scratch-path "$RUNNER_TEMP/operate-history-build"

      - name: Build Operate package, executable and test targets
        if: steps.operate.outputs.changed == 'true'
        working-directory: operate
        run: swift build --manifest-cache local --build-tests --scratch-path "$RUNNER_TEMP/operate-package-build"

      - name: Test injected permission denial without native device access
        if: steps.operate.outputs.changed == 'true'
        working-directory: operate
        run: swift test --manifest-cache local --scratch-path "$RUNNER_TEMP/operate-package-build" --filter PermissionServiceTests

      - name: Verify CLI version output and stderr hygiene
        if: steps.operate.outputs.changed == 'true'
        working-directory: operate
        run: |
          set -euo pipefail
          bin="$(swift build --scratch-path "$RUNNER_TEMP/operate-package-build" --show-bin-path)/symoperate"
          test -x "$bin"
          "$bin" version --json >"$RUNNER_TEMP/symoperate-version.json" 2>"$RUNNER_TEMP/symoperate-version.stderr"
          test ! -s "$RUNNER_TEMP/symoperate-version.stderr"
          python3 - "$RUNNER_TEMP/symoperate-version.json" <<'PY'
          import json
          import pathlib
          import sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert value["version"]
          PY

      - name: Verify native MCP initialize and twenty-tool catalog (no tools/call)
        if: steps.operate.outputs.changed == 'true'
        working-directory: operate
        run: |
          set -euo pipefail
          bin="$(swift build --scratch-path "$RUNNER_TEMP/operate-package-build" --show-bin-path)/symoperate"
          test -x "$bin"
          python3 ../scripts/operate-mcp-smoke.py "$bin" --timeout 10
          python3 ../scripts/operate-mcp-smoke.py --self-test

  # Build-only, narrower than scope-native-swiftpm, same rationale as
  # operate-native-swiftpm: Browse's own test suite touches live Chrome and
  # network I/O and is not safe to run unattended in CI (see
  # browse/SOURCE_PROVENANCE.md). This job builds the Go module and the Rust
  # workspace, and exercises the CLI/MCP protocol surface without ever
  # driving a real browser — version output and initialize/tools-list only,
  # never tools/call.
  browse-native:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect Browse package changes
        id: browse
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq '^browse/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.browse.outputs.changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: browse/go.mod
          cache: true
          cache-dependency-path: browse/go.sum

      - name: Build and vet Go module
        if: steps.browse.outputs.changed == 'true'
        working-directory: browse
        run: |
          go build ./...
          go vet ./...

      - name: Resolve pinned Rust toolchain
        if: steps.browse.outputs.changed == 'true'
        working-directory: browse
        run: rustup show active-toolchain

      - name: Build Rust workspace
        if: steps.browse.outputs.changed == 'true'
        working-directory: browse
        run: cargo build --workspace --locked

      - name: Build CLI and verify version output
        if: steps.browse.outputs.changed == 'true'
        working-directory: browse
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/symbrowse-brain-check" ./cmd/symbrowse
          test -x "$RUNNER_TEMP/symbrowse-brain-check"
          "$RUNNER_TEMP/symbrowse-brain-check" version --json >"$RUNNER_TEMP/symbrowse-version.json"
          python3 - "$RUNNER_TEMP/symbrowse-version.json" <<'PY'
          import json
          import pathlib
          import sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert value["tool"] == "symbrowse"
          assert value["version"]
          PY

      - name: Verify native MCP initialize and tools/list (no tools/call)
        if: steps.browse.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 scripts/browse-mcp-smoke.py "$RUNNER_TEMP/symbrowse-brain-check" --timeout 10
          python3 scripts/browse-mcp-smoke.py --self-test

  # Exercise Browse's Windows named-pipe daemon tests on a native runner.
  browse-windows-daemon:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 20
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Resolve pinned Rust toolchain
        working-directory: browse
        run: rustup show active-toolchain

      - name: Cache Browse Rust test dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: browse-daemon-v1-${{ runner.os }}-${{ runner.arch }}-toolchain-${{ hashFiles('browse/rust-toolchain.toml') }}-lock-${{ hashFiles('browse/Cargo.lock') }}

      - name: Test Browse daemon platform support
        working-directory: browse
        run: cargo test -p symbrowse-daemon --test platform --locked

  # Compare the CoreKit-backed Rust version contract with the Go oracle on
  # native Windows; cross-compilation cannot establish Windows runtime parity.
  browse-corekit-version-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Set up Go oracle
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: browse/go.mod
          cache-dependency-path: browse/go.sum

      - name: Resolve pinned Rust toolchain
        working-directory: browse
        run: rustup show active-toolchain

      - name: Test and build native Windows binaries
        working-directory: browse
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symbrowse-protocol --locked
          go build -o "$RUNNER_TEMP/symbrowse-go.exe" ./cmd/symbrowse
          cargo build -p symbrowse-cli --locked

      - name: Compare CoreKit-backed version output with Go
        working-directory: browse
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/symbrowse-go.exe" version >"$RUNNER_TEMP/go-version.txt"
          target/debug/symbrowse.exe version >"$RUNNER_TEMP/rust-version.txt"
          cmp "$RUNNER_TEMP/go-version.txt" "$RUNNER_TEMP/rust-version.txt"
          "$RUNNER_TEMP/symbrowse-go.exe" version --json >"$RUNNER_TEMP/go-version.json"
          target/debug/symbrowse.exe version --json >"$RUNNER_TEMP/rust-version.json"
          cmp "$RUNNER_TEMP/go-version.json" "$RUNNER_TEMP/rust-version.json"

  # jobs above run on ubuntu-latest and never exercise xcodebuild, so a
  # Swift compile error or a failing SymBrainCoreTests used to surface only
  # at release time (precedent: v0.5.1 GUI release-asset failure, #212,
  # fixed by #215). Path-filtered inside the job so Go-only PRs do not pay
  # macOS runner cost, while the check itself always reports so it can be
  # required by the main protection ruleset.
  gui:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify Xcode 26 toolchain
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version | sed -n '1p')"
          echo "$XCODE_VERSION"
          case "$XCODE_VERSION" in
            Xcode\ 26.*|Xcode\ 27.*) ;;
            *) echo "::error::Expected Xcode 26 or newer, got: $XCODE_VERSION"; exit 1 ;;
          esac

      - name: Detect Swift-related changes
        id: swift
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "${BASE_SHA:-}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | \
             grep -Eq '^(Sources/|Tests/|project\.yml|SymBrain\.xcodeproj/|assets/app-icon/|scripts/check-app-icons\.sh$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Same local-path-to-URL patch release.yml applies: harmless no-op
      # while project.yml pins a URL + exactVersion, but keeps CI working
      # if a local path ever gets committed by accident.
      - name: Patch project.yml for CI (replace local path dependency with pinned URL)
        if: steps.swift.outputs.changed == 'true'
        run: |
          perl -i'' -pe "s|path: ../symaira-appkit|url: https://github.com/danieljustus/symaira-appkit\\nexactVersion: 0.6.0|" project.yml

      - name: Install XcodeGen
        if: steps.swift.outputs.changed == 'true'
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        if: steps.swift.outputs.changed == 'true'
        run: xcodegen generate

      - name: Verify native AppIcon sources
        if: steps.swift.outputs.changed == 'true'
        run: bash scripts/check-app-icons.sh

      - name: Build SymBrain app
        if: steps.swift.outputs.changed == 'true'
        run: |
          xcodebuild -project SymBrain.xcodeproj \
            -scheme SymBrain \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SymBrain-macos-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify compiled macOS AppIcon
        if: steps.swift.outputs.changed == 'true'
        run: bash scripts/check-app-icons.sh --bundle "$RUNNER_TEMP/SymBrain-macos-derived-data/Build/Products/Debug/Symaira Brain.app" --platform macOS

      - name: Build and test SymBrainCore
        if: steps.swift.outputs.changed == 'true'
        run: |
          xcodebuild -project SymBrain.xcodeproj \
            -scheme SymBrainCore \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SymBrain-macos-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build test

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.swift.outputs.changed == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Compare GUI JSON decoding against Go and Rust binaries
        if: steps.swift.outputs.changed == 'true'
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/symbrain-go" ./cmd/symbrain
          cargo build -p symbrain-cli --locked
          for implementation in go rust; do
            if [ "$implementation" = go ]; then
              binary="$RUNNER_TEMP/symbrain-go"
            else
              binary="$PWD/target/debug/symbrain"
            fi
            gui_test_home="$(mktemp -d "/private/tmp/gui-contract-$implementation.XXXXXX")"
            mkdir -p "$gui_test_home/.config"
            printf '%s\n' "$binary" > "$gui_test_home/.symbrain-test-binary"
            result="$RUNNER_TEMP/gui-contract-$implementation.xcresult"
            python3 - "$gui_test_home" "$binary" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          scheme = Path('SymBrain.xcodeproj/xcshareddata/xcschemes/SymBrainCoreContract.xcscheme')
          home, binary = sys.argv[1:]
          values = {'HOME': home, 'XDG_CONFIG_HOME': home + '/.config', 'SYMBRAIN_TEST_BINARY': binary}
          tree = ET.parse(scheme)
          found = set()
          for variable in tree.iter('EnvironmentVariable'):
              key = variable.get('key')
              if key in values:
                  variable.set('value', values[key])
                  found.add(key)
          assert found == values.keys(), found
          tree.write(scheme, encoding='UTF-8', xml_declaration=True)
          PY
            xcodebuild -project SymBrain.xcodeproj \
                -scheme SymBrainCoreContract \
                -destination 'platform=macOS' \
                -derivedDataPath "$RUNNER_TEMP/SymBrain-macos-derived-data" \
                -resultBundlePath "$result" \
                -only-testing:SymBrainCoreTests/ConfiguredBinaryContractTests \
                CODE_SIGNING_ALLOWED=NO test
            xcrun xcresulttool get test-results summary --path "$result" | \
              python3 -c 'import json,sys; x=json.load(sys.stdin); assert (x["totalTestCount"], x["passedTests"], x["failedTests"], x["skippedTests"]) == (1, 1, 0, 0), x'
          done

      - name: Resolve pinned iOS simulator
        if: steps.swift.outputs.changed == 'true'
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,re,sys; data=json.load(sys.stdin); cands=sorted(((int(m.group(1)), d['udid']) for lst in data['devices'].values() for d in lst for m in [re.fullmatch(r'iPhone (\\d+)', d['name'])] if m), reverse=True); print(cands[0][1]) if cands else sys.exit(1)")
          test -n "$UDID" || { echo "::error::No available plain iPhone simulator found"; xcrun simctl list devices available; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build SymBrainMobile
        if: steps.swift.outputs.changed == 'true'
        run: |
          xcodebuild -project SymBrain.xcodeproj \
            -scheme SymBrainMobile \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/SymBrain-ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify compiled iOS AppIcon
        if: steps.swift.outputs.changed == 'true'
        run: bash scripts/check-app-icons.sh --bundle "$RUNNER_TEMP/SymBrain-ios-derived-data/Build/Products/Debug-iphonesimulator/Symaira Brain.app" --platform iOS

  # Validates .goreleaser.yml on every push/PR, not only at tag time, so a
  # broken release config is caught long before a real release tag is
  # pushed. Runs the real build/archive/checksum/SBOM pipeline a release
  # would (--snapshot skips publishing); signing is skipped here because it
  # needs the tag-triggered release workflow's ambient OIDC token, which a
  # plain push/PR run does not have.
  goreleaser-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: goreleaser release --snapshot --clean
        id: snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=sign

      - name: Verify unpublished snapshot archives and checksums
        env:
          GORELEASER_ARTIFACTS: ${{ steps.snapshot.outputs.artifacts }}
          GORELEASER_METADATA: ${{ steps.snapshot.outputs.metadata }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json, os; print(json.loads(os.environ["GORELEASER_METADATA"])["version"])')"
          candidate_dir="$RUNNER_TEMP/symbrain-candidate-archives"
          mkdir -p "$candidate_dir"
          python3 - "$candidate_dir" <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import sys

          destination = Path(sys.argv[1])
          artifacts = json.loads(os.environ["GORELEASER_ARTIFACTS"])
          selected = [item for item in artifacts if item.get("type") in {"Archive", "Checksum"}]
          archives = [item for item in selected if item["type"] == "Archive"]
          checksums = [item for item in selected if item["type"] == "Checksum"]
          if len(checksums) != 1:
              raise SystemExit(f"expected one GoReleaser checksum artifact, found {len(checksums)}")
          if not archives:
              raise SystemExit("GoReleaser output contains no Archive artifacts")
          for item in selected:
              source = Path(item["path"])
              if source.is_absolute() or ".." in source.parts or source.name != item["name"]:
                  raise SystemExit(f"unsafe or inconsistent GoReleaser artifact path: {item}")
              if not source.is_file() or source.is_symlink():
                  raise SystemExit(f"GoReleaser artifact is not a regular file: {source}")
              shutil.copy2(source, destination / item["name"])
          print(f"staged {len(archives)} GoReleaser archives and {checksums[0]['name']}")
          PY
          go run ./scripts/dist-oracle -candidate-check -version "$version" -assets "$candidate_dir"

  coverage:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # make coverage only reads HEAD; no oracle or history traversal.
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Reuses the coverprofile + test log from the build-test job instead
      # of re-running the suite (make coverage honors COVERAGE_PROFILE /
      # COVERAGE_LOG and skips go test when both are set).
      - name: Download coverage inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-input-${{ github.sha }}

      - name: Generate coverage artifacts
        run: make coverage
        env:
          COVERAGE_PROFILE: coverage.out
          COVERAGE_LOG: test.log

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage.json
            badge.json
            badge.svg

  # coverage-data is a persistent orphan data branch, not a source branch.
  # Repository settings must exempt it from branch cleanup and either leave
  # it unprotected or grant this job the bypass needed for its force update.
  # The workflow intentionally never deletes the branch.
  publish-coverage-data:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-${{ github.sha }}
          path: /tmp/coverage-artifacts/

      - name: Publish coverage-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Verify artifacts are available before switching branches
          ls /tmp/coverage-artifacts/coverage.json /tmp/coverage-artifacts/badge.json /tmp/coverage-artifacts/badge.svg >/dev/null 2>&1 || {
            echo "ERROR: coverage artifacts not found in /tmp/coverage-artifacts/"
            ls -la /tmp/coverage-artifacts/ 2>/dev/null || echo "  (directory does not exist)"
            exit 1
          }
          git checkout --orphan coverage-data
          git rm -rf . 2>/dev/null || true
          cp /tmp/coverage-artifacts/* .
          git add coverage.json badge.json badge.svg
          git commit -m "ci: publish coverage for $GITHUB_SHA"
          git push origin HEAD:coverage-data --force
