name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  # The merge queue runs the same checks on the queued merge commit.
  merge_group:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hosted macOS runners queue for hours, so the macOS jobs start only when the
  # diff can affect them. scripts/ci-changed-areas.sh maps changed paths to
  # `native` and `gui`; a path it does not know sets both. A job skipped by
  # `if:` still reports its check, so the required `gui` check keeps reporting.
  # A failed `changes` job runs everything (`!= 'false'`), never skips it.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.detect.outputs.native }}
      gui: ${{ steps.detect.outputs.gui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check the path-to-job table
        run: ./scripts/test-ci-changed-areas.sh

      - name: Detect affected jobs
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A pull request compares its head with the merge base; a push
          # compares with the previous tip. Anything else (new branch, force
          # push, schedule, dispatch, merge queue) runs every job. The fallback
          # path is a CI-wiring path, which the table maps to every job.
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          elif [ "$EVENT_NAME" = push ] && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          else
            echo ".github/workflows/ci.yml" > "$RUNNER_TEMP/changed.txt"
          fi
          echo "Changed paths:"
          cat "$RUNNER_TEMP/changed.txt"
          ./scripts/ci-changed-areas.sh < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

  # Fail if any action is referenced by mutable tag instead of SHA.
  # Keeps the supply-chain surface small — tag moves are caught here.
  pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for unpinned actions
        run: |
          matches=$(grep -rn '^\s*uses:' .github/workflows/ --include='*.yml' \
            | grep -v '@[0-9a-f]\{40\}' || true)
          if [ -n "$matches" ]; then
            echo "::error::Unpinned action references found (use SHA, not tag):"
            echo "$matches"
            exit 1
          fi
          echo "All actions are pinned to SHA."

  macos-release-verification-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prove notarization failures prevent publication
        run: python3 -m unittest discover -s scripts -p test_macos_release_verification.py -v

  # Unit tests for the differential harness and the skills-status mutant
  # runner: timeouts must stay failures and keep earlier diagnostics (#940).
  differential-harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # defaults_inventory.py reads the frozen Go migration SQL from history.
          fetch-depth: 0
      - name: Differential harness timeout handling
        run: python3 -m unittest discover -s scripts -p test_rust_differential.py -v
      - name: Accepted-divergence contracts (doctor and harness list)
        run: python3 -m unittest discover -s scripts -p 'test_*_contract.py' -v
      - name: Skills-status mutant classification
        run: python3 -m unittest discover -s scripts/skills-status-config-oracle -p test_run.py -v
      - name: Memory store corrupt-read classification
        run: python3 -m unittest discover -s scripts/memory-cli-oracle -p test_corrupt_reads.py -v
      - name: Owned memory column defaults against the frozen Go migrations
        run: python3 scripts/memory-historical-oracle/defaults_inventory.py --output "$RUNNER_TEMP/memory-defaults"

  # The complete Go-free Rust gate: fmt, check, clippy -D warnings, every
  # workspace test (including the frozen Go-oracle replays), doc tests,
  # cargo-audit/cargo-deny, the sealed oracle fixtures and the black-box CLI
  # and init transcripts. `build-test` is a required check name.
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust quality dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: rust-quality-install-meta-v2-${{ runner.os }}-${{ runner.arch }}-toolchain-${{ hashFiles('rust-toolchain.toml') }}-lock-${{ hashFiles('Cargo.lock') }}-audit-0.22.2-deny-0.20.2

      - name: Install pinned Rust audit tools
        shell: sh
        run: |
          set -eu
          audit_version="$(cargo-audit --version 2>/dev/null || true)"
          if [ "$audit_version" != "cargo-audit 0.22.2" ]; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
          deny_version="$(cargo-deny --version 2>/dev/null || true)"
          if [ "$deny_version" != "cargo-deny 0.20.2" ]; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi

      - name: Rust quality gate and frozen Go-transcript parity
        run: make rust-check parity-smoke

      - name: Frozen init transcripts
        run: make init-differential

  # Filesystem, process and stdio paths whose macOS behavior Linux CI cannot
  # establish run the same gate natively.
  build-test-macos:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust quality dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: rust-quality-install-meta-v2-${{ runner.os }}-${{ runner.arch }}-toolchain-${{ hashFiles('rust-toolchain.toml') }}-lock-${{ hashFiles('Cargo.lock') }}-audit-0.22.2-deny-0.20.2

      - name: Install pinned Rust audit tools
        shell: sh
        run: |
          set -eu
          audit_version="$(cargo-audit --version 2>/dev/null || true)"
          if [ "$audit_version" != "cargo-audit 0.22.2" ]; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
          deny_version="$(cargo-deny --version 2>/dev/null || true)"
          if [ "$deny_version" != "cargo-deny 0.20.2" ]; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi

      - name: Rust quality gate and frozen Go-transcript parity on macOS
        run: make rust-check parity-smoke

      - name: Frozen init transcripts on macOS
        run: make init-differential

  rust-mcp-fuzz-smoke:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install nightly Rust and pinned cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz both MCP targets with retained Go seeds
        run: make rust-fuzz-smoke

  # Stdio hygiene gate: `symbrain mcp` must emit nothing but JSON-RPC
  # frames on stdout across startup, tools/list, a failing tools/call and
  # shutdown (fake children). A dedicated job so a transport-breaking
  # regression is visible by name, not buried in the unit-test log.
  stdio-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Stdio hygiene gate
        run: cargo test -p symbrain-cli --test mcp_cli_tests --locked

  # The required check keeps its historical name; it now scans the Rust
  # lockfiles for advisories and enforces the dependency/license policy.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust quality dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: rust-quality-install-meta-v2-${{ runner.os }}-${{ runner.arch }}-toolchain-${{ hashFiles('rust-toolchain.toml') }}-lock-${{ hashFiles('Cargo.lock') }}-audit-0.22.2-deny-0.20.2

      - name: Install pinned Rust audit tools
        shell: sh
        run: |
          set -eu
          audit_version="$(cargo-audit --version 2>/dev/null || true)"
          if [ "$audit_version" != "cargo-audit 0.22.2" ]; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
          deny_version="$(cargo-deny --version 2>/dev/null || true)"
          if [ "$deny_version" != "cargo-deny 0.20.2" ]; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi

      - name: Rust advisories and dependency policy
        run: make rust-audit rust-deny

  # Native package acceptance for the optional Scope intake. This is separate
  # from the GUI job: it builds and tests both packages and exercises the
  # checked-in executable over its real MCP stdio transport. It runs for real
  # Scope/history changes on main pushes, and unconditionally on the
  # scheduled/full-main and manually dispatched suites.
  scope-native-swiftpm:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 15
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect Scope package changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq '^(scope/|history/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve installed Xcode and Swift toolchain
        if: steps.scope.outputs.changed == 'true'
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Build history package
        if: steps.scope.outputs.changed == 'true'
        working-directory: history
        run: swift build --scratch-path "$RUNNER_TEMP/scope-history-build"

      - name: Test history package
        if: steps.scope.outputs.changed == 'true'
        working-directory: history
        run: swift test --scratch-path "$RUNNER_TEMP/scope-history-build"

      - name: Build Scope package and executable
        if: steps.scope.outputs.changed == 'true'
        working-directory: scope
        run: swift build --scratch-path "$RUNNER_TEMP/scope-package-build"

      - name: Test Scope package
        if: steps.scope.outputs.changed == 'true'
        working-directory: scope
        run: swift test --scratch-path "$RUNNER_TEMP/scope-package-build"

      - name: Verify CLI version output and stderr hygiene
        if: steps.scope.outputs.changed == 'true'
        working-directory: scope
        run: |
          set -euo pipefail
          bin="$(swift build --scratch-path "$RUNNER_TEMP/scope-package-build" --show-bin-path)/symscope"
          test -x "$bin"
          "$bin" version --json >"$RUNNER_TEMP/symscope-version.json" 2>"$RUNNER_TEMP/symscope-version.stderr"
          test ! -s "$RUNNER_TEMP/symscope-version.stderr"
          python3 - "$RUNNER_TEMP/symscope-version.json" <<'PY'
          import json
          import pathlib
          import sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert value["tool"] == "symscope"
          assert value["version"]
          assert value["schema_version"] == 1
          PY

      - name: Verify native MCP initialize and seven-tool catalog
        if: steps.scope.outputs.changed == 'true'
        working-directory: scope
        run: |
          set -euo pipefail
          bin="$(swift build --scratch-path "$RUNNER_TEMP/scope-package-build" --show-bin-path)/symscope"
          test -x "$bin"
          python3 ../scripts/scope-mcp-smoke.py "$bin" --timeout 10
          python3 ../scripts/scope-mcp-smoke.py --self-test

  # Native package acceptance for the optional Operate intake (PB-2026-09-09
  # package 3, source-intake stage only — see operate/SOURCE_PROVENANCE.md).
  # Deliberately narrower than scope-native-swiftpm: Operate's own test
  # targets (SymOperateCoreTests, SymOperateSmokeTests) exercise real
  # ScreenCaptureKit/Accessibility APIs even with permission-denied fallbacks
  # written in, and the operator brief for this package requires "controlled
  # fixture apps only; no live desktop automation as a migration smoke test."
  # Compile every test target, but execute only PermissionServiceTests,
  # whose injected probes never invoke native TCC or open System Settings.
  # Also exercise the
  # MCP transport with initialize/tools-list only, never tools/call.
  operate-native-swiftpm:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 15
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect Operate package changes
        id: operate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq '^(operate/|history/|scripts/operate-mcp-smoke\.py$|\.github/workflows/ci\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve installed Xcode and Swift toolchain
        if: steps.operate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Build history package
        if: steps.operate.outputs.changed == 'true'
        working-directory: history
        run: swift build --scratch-path "$RUNNER_TEMP/operate-history-build"

      - name: Build Operate package, executable and test targets
        if: steps.operate.outputs.changed == 'true'
        working-directory: operate
        run: swift build --manifest-cache local --build-tests --scratch-path "$RUNNER_TEMP/operate-package-build"

      - name: Test injected permission denial without native device access
        if: steps.operate.outputs.changed == 'true'
        working-directory: operate
        run: swift test --manifest-cache local --scratch-path "$RUNNER_TEMP/operate-package-build" --filter PermissionServiceTests

      - name: Verify CLI version output and stderr hygiene
        if: steps.operate.outputs.changed == 'true'
        working-directory: operate
        run: |
          set -euo pipefail
          bin="$(swift build --scratch-path "$RUNNER_TEMP/operate-package-build" --show-bin-path)/symoperate"
          test -x "$bin"
          "$bin" version --json >"$RUNNER_TEMP/symoperate-version.json" 2>"$RUNNER_TEMP/symoperate-version.stderr"
          test ! -s "$RUNNER_TEMP/symoperate-version.stderr"
          python3 - "$RUNNER_TEMP/symoperate-version.json" <<'PY'
          import json
          import pathlib
          import sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert value["version"]
          PY

      - name: Verify native MCP initialize and twenty-tool catalog (no tools/call)
        if: steps.operate.outputs.changed == 'true'
        working-directory: operate
        run: |
          set -euo pipefail
          bin="$(swift build --scratch-path "$RUNNER_TEMP/operate-package-build" --show-bin-path)/symoperate"
          test -x "$bin"
          python3 ../scripts/operate-mcp-smoke.py "$bin" --timeout 10
          python3 ../scripts/operate-mcp-smoke.py --self-test

  # Builds and tests the Browse Rust workspace (real-Chrome E2E stays opt-in
  # behind SYMBROWSE_E2E) and exercises the CLI/MCP protocol surface without
  # ever driving a real browser: version output and initialize/tools-list
  # only, never tools/call.
  browse-native:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect Browse package changes
        id: browse
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq '^browse/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve pinned Rust toolchain
        if: steps.browse.outputs.changed == 'true'
        working-directory: browse
        run: rustup show active-toolchain

      - name: Lint and test Rust workspace
        if: steps.browse.outputs.changed == 'true'
        working-directory: browse
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --locked

      - name: Build CLI and verify version output
        if: steps.browse.outputs.changed == 'true'
        working-directory: browse
        run: |
          set -euo pipefail
          cargo build --release --locked -p symbrowse-cli
          cp target/release/symbrowse "$RUNNER_TEMP/symbrowse-brain-check"
          test -x "$RUNNER_TEMP/symbrowse-brain-check"
          "$RUNNER_TEMP/symbrowse-brain-check" version --json >"$RUNNER_TEMP/symbrowse-version.json"
          python3 - "$RUNNER_TEMP/symbrowse-version.json" <<'PY'
          import json
          import pathlib
          import sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert value["tool"] == "symbrowse"
          assert value["version"]
          PY

      - name: Verify native MCP initialize and tools/list (no tools/call)
        if: steps.browse.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 scripts/browse-mcp-smoke.py "$RUNNER_TEMP/symbrowse-brain-check" --timeout 10
          python3 scripts/browse-mcp-smoke.py --self-test

  # jobs above run on ubuntu-latest and never exercise xcodebuild, so a
  # Swift compile error or a failing SymBrainCoreTests used to surface only
  # at release time (precedent: v0.5.1 GUI release-asset failure, #212,
  # fixed by #215). The job is skipped through `changes` unless the diff can
  # affect the app (scripts/ci-changed-areas.sh), so Rust-only and docs-only
  # PRs do not queue for a macOS runner. A skipped job still reports `gui`, which
  # the main protection ruleset requires.
  gui:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.gui != 'false' }}
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify Xcode 26 toolchain
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version | sed -n '1p')"
          echo "$XCODE_VERSION"
          case "$XCODE_VERSION" in
            Xcode\ 26.*|Xcode\ 27.*) ;;
            *) echo "::error::Expected Xcode 26 or newer, got: $XCODE_VERSION"; exit 1 ;;
          esac

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify native AppIcon sources
        run: bash scripts/check-app-icons.sh

      - name: Build SymBrain app
        run: |
          xcodebuild -project SymBrain.xcodeproj \
            -scheme SymBrain \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SymBrain-macos-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify compiled macOS AppIcon
        run: bash scripts/check-app-icons.sh --bundle "$RUNNER_TEMP/SymBrain-macos-derived-data/Build/Products/Debug/Symaira Brain.app" --platform macOS

      - name: Build and test SymBrainCore
        run: |
          xcodebuild -project SymBrain.xcodeproj \
            -scheme SymBrainCore \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SymBrain-macos-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build test

      - name: Decode the real CLI JSON in the GUI contract tests
        run: |
          set -euo pipefail
          cargo build -p symbrain-cli --locked
          for implementation in rust; do
            binary="$PWD/target/debug/symbrain"
            gui_test_home="$(mktemp -d "/private/tmp/gui-contract-$implementation.XXXXXX")"
            mkdir -p "$gui_test_home/.config"
            printf '%s\n' "$binary" > "$gui_test_home/.symbrain-test-binary"
            result="$RUNNER_TEMP/gui-contract-$implementation.xcresult"
            python3 - "$gui_test_home" "$binary" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          scheme = Path('SymBrain.xcodeproj/xcshareddata/xcschemes/SymBrainCoreContract.xcscheme')
          home, binary = sys.argv[1:]
          values = {'HOME': home, 'XDG_CONFIG_HOME': home + '/.config', 'SYMBRAIN_TEST_BINARY': binary}
          tree = ET.parse(scheme)
          found = set()
          for variable in tree.iter('EnvironmentVariable'):
              key = variable.get('key')
              if key in values:
                  variable.set('value', values[key])
                  found.add(key)
          assert found == values.keys(), found
          tree.write(scheme, encoding='UTF-8', xml_declaration=True)
          PY
            xcodebuild -project SymBrain.xcodeproj \
                -scheme SymBrainCoreContract \
                -destination 'platform=macOS' \
                -derivedDataPath "$RUNNER_TEMP/SymBrain-macos-derived-data" \
                -resultBundlePath "$result" \
                -only-testing:SymBrainCoreTests/ConfiguredBinaryContractTests \
                CODE_SIGNING_ALLOWED=NO test
            xcrun xcresulttool get test-results summary --path "$result" | \
              python3 -c 'import json,sys; x=json.load(sys.stdin); assert (x["totalTestCount"], x["passedTests"], x["failedTests"], x["skippedTests"]) == (1, 1, 0, 0), x'
          done

      - name: Resolve pinned iOS simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,re,sys; data=json.load(sys.stdin); cands=sorted(((int(m.group(1)), d['udid']) for lst in data['devices'].values() for d in lst for m in [re.fullmatch(r'iPhone (\\d+)', d['name'])] if m), reverse=True); print(cands[0][1]) if cands else sys.exit(1)")
          test -n "$UDID" || { echo "::error::No available plain iPhone simulator found"; xcrun simctl list devices available; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build SymBrainMobile
        run: |
          xcodebuild -project SymBrain.xcodeproj \
            -scheme SymBrainMobile \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/SymBrain-ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify compiled iOS AppIcon
        run: bash scripts/check-app-icons.sh --bundle "$RUNNER_TEMP/SymBrain-ios-derived-data/Build/Products/Debug-iphonesimulator/Symaira Brain.app" --platform iOS

  # Rust workspace line coverage with the tracked floor; also renders the
  # badge files the publish job pushes to the coverage-data branch.
  coverage:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve the pinned Rust and LLVM tools
        run: |
          rustup show active-toolchain
          rustup component add llvm-tools-preview

      - name: Cache coverage tool dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'rust/coverage-policy.json') }}

      - name: Install the pinned coverage tool
        run: cargo install cargo-llvm-cov --version 0.6.21 --locked

      - name: Coverage failure and denominator controls
        run: python3 -m unittest discover -s scripts/rust-coverage -p test_reports.py -v

      - name: Enforce the Rust workspace floor and render the badge
        run: make coverage

      - name: Report the full denominator and per-crate diagnostics
        if: always()
        run: python3 scripts/rust-coverage/report.py --report target/coverage/rust.json --summary target/coverage/summary.json --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload badge artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage.json
            badge.json
            badge.svg

      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage-${{ github.sha }}
          path: target/coverage/*.json
          if-no-files-found: error
          retention-days: 14

  # coverage-data is a persistent orphan data branch, not a source branch.
  # Repository settings must exempt it from branch cleanup and either leave
  # it unprotected or grant this job the bypass needed for its force update.
  # The workflow intentionally never deletes the branch.
  publish-coverage-data:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Download coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-${{ github.sha }}
          path: /tmp/coverage-artifacts/

      - name: Publish coverage-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Verify artifacts are available before switching branches
          ls /tmp/coverage-artifacts/coverage.json /tmp/coverage-artifacts/badge.json /tmp/coverage-artifacts/badge.svg >/dev/null 2>&1 || {
            echo "ERROR: coverage artifacts not found in /tmp/coverage-artifacts/"
            ls -la /tmp/coverage-artifacts/ 2>/dev/null || echo "  (directory does not exist)"
            exit 1
          }
          git checkout --orphan coverage-data
          git rm -rf . 2>/dev/null || true
          cp /tmp/coverage-artifacts/* .
          git add coverage.json badge.json badge.svg
          git commit -m "ci: publish coverage for $GITHUB_SHA"
          git push origin HEAD:coverage-data --force
