name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  # The merge queue runs the same checks on the queued merge commit.
  merge_group:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hosted macOS runners queue for hours, so the macOS jobs start only when the
  # diff can affect them. scripts/ci-changed-areas.sh maps changed paths to
  # `native` and `gui`; a path it does not know sets both. A job skipped by
  # `if:` still reports its check, so the required `gui` check keeps reporting.
  # A failed `changes` job runs everything (`!= 'false'`), never skips it.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.detect.outputs.native }}
      gui: ${{ steps.detect.outputs.gui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check the path-to-job table
        run: ./scripts/test-ci-changed-areas.sh

      - name: Detect affected jobs
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A pull request compares its head with the merge base; a push
          # compares with the previous tip. Anything else (new branch, force
          # push, schedule, dispatch, merge queue) runs every job. The fallback
          # path is a CI-wiring path, which the table maps to every job.
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          elif [ "$EVENT_NAME" = push ] && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          else
            echo ".github/workflows/ci.yml" > "$RUNNER_TEMP/changed.txt"
          fi
          echo "Changed paths:"
          cat "$RUNNER_TEMP/changed.txt"
          ./scripts/ci-changed-areas.sh < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

  # Fail if any action is referenced by mutable tag instead of SHA.
  # Keeps the supply-chain surface small — tag moves are caught here.
  pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for unpinned actions
        run: |
          matches=$(grep -rn '^\s*uses:' .github/workflows/ --include='*.yml' \
            | grep -v '@[0-9a-f]\{40\}' || true)
          if [ -n "$matches" ]; then
            echo "::error::Unpinned action references found (use SHA, not tag):"
            echo "$matches"
            exit 1
          fi
          echo "All actions are pinned to SHA."

      - name: Check native Guard uploads retain every standalone report
        run: python3 -m unittest discover -s scripts/guard-standalone-oracle -p test_upload_inventory.py -v

  macos-release-verification-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prove notarization failures prevent publication
        run: python3 -m unittest discover -s scripts -p test_macos_release_verification.py -v

  # Unit tests for the differential harness and the skills-status mutant
  # runner: timeouts must stay failures and keep earlier diagnostics (#940).
  differential-harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Differential harness timeout handling
        run: python3 -m unittest discover -s scripts -p test_rust_differential.py -v
      - name: Skills-status mutant classification
        run: python3 -m unittest discover -s scripts/skills-status-config-oracle -p test_run.py -v

  # golangci-lint has a known incompatibility with Go 1.26 in this
  # ecosystem (see symaira-scope). gofmt + go vet below are the lint gate
  # until golangci-lint ships a Go-1.26-compatible release — re-enable a
  # dedicated lint job at that point.
  # Lint and CGO-free build stay their own job so they can start immediately;
  # the race suite below runs as parallel shards (see build-test).
  go-lint-build:
    runs-on: ubuntu-latest
    env:
      # Default-path tests intentionally exercise the HOME fallback; keep
      # runner-level XDG configuration from redirecting their fixtures.
      XDG_CONFIG_HOME: ""
      XDG_DATA_HOME: ""
      XDG_CACHE_HOME: ""
      XDG_STATE_HOME: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint (go vet + gofmt check, matches local make lint)
        run: make lint

      # symbrain ships CGO-free; verify that build configuration explicitly.
      - name: Build (CGO-free)
        run: go build ./...
        env:
          CGO_ENABLED: "0"

  # The Go race suite serializes package processes (`-p 1`) because several
  # packages use default XDG paths and would otherwise share one fixture
  # database. Serialization is a correctness requirement, so the wall clock is
  # cut by sharding across runners instead of relaxing the flag:
  # `scripts/ci-go-test-shards.sh` assigns every package exactly once, greedily
  # balanced by measured duration, and still runs the identical flags. -race
  # requires cgo, so these steps deliberately do not set CGO_ENABLED=0.
  go-test-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      XDG_CONFIG_HOME: ""
      XDG_DATA_HOME: ""
      XDG_CACHE_HOME: ""
      XDG_STATE_HOME: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test (race detector, shard ${{ matrix.shard }} of 4)
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci-go-test-shards.sh --run "${{ matrix.shard }}" 4 "${RUNNER_TEMP:-/tmp}/go-shard"

      - name: Upload shard coverage inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-input-${{ github.sha }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/go-shard/*
          retention-days: 1

  # Aggregate gate for the Go side: keeps the historical `build-test` check
  # name and rebuilds the single coverage-input artifact the coverage job
  # consumes, so sharding stays invisible to every other job and to the
  # coverage pipeline. Every package still runs exactly once with the same
  # flags; only the runner changed.
  build-test:
    needs: [go-lint-build, go-test-shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Download shard coverage inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-input-${{ github.sha }}-*
          path: ${{ runner.temp }}/go-shards
          merge-multiple: true

      - name: Merge shard coverage inputs
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci-go-test-shards.sh --merge 4 "${RUNNER_TEMP:-/tmp}/go-shards" .

      # The coverprofile and test log are uploaded so the coverage job can
      # build its artifacts without running the suite a second time.
      - name: Upload coverage inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-input-${{ github.sha }}
          path: |
            coverage.out
            test.log
          retention-days: 1

  # Keep the incremental Rust entrypoint green while Go remains the oracle.
  rust-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Oracle generators verify the pinned rollback baseline.
          fetch-depth: 0

      - name: Set up Go oracle
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust quality dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: rust-quality-install-meta-v2-${{ runner.os }}-${{ runner.arch }}-toolchain-${{ hashFiles('rust-toolchain.toml') }}-lock-${{ hashFiles('Cargo.lock') }}-audit-0.22.2-deny-0.20.2

      - name: Install pinned Rust audit tools
        shell: sh
        run: |
          set -eu
          audit_version="$(cargo-audit --version 2>/dev/null || true)"
          if [ "$audit_version" != "cargo-audit 0.22.2" ]; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
          deny_version="$(cargo-deny --version 2>/dev/null || true)"
          if [ "$deny_version" != "cargo-deny 0.20.2" ]; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi

      - name: Rust quality and Go parity gates
        run: make rust-check parity-smoke

      - name: Go/Rust native doctor repair and negative process controls
        shell: bash
        run: scripts/doctor-repair-oracle/run.sh "$RUNNER_TEMP/doctor-repair-parity.json"

      - name: Preserve doctor repair process parity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doctor-repair-parity-${{ runner.os }}
          path: ${{ runner.temp }}/doctor-repair-parity*.json
          if-no-files-found: error
          retention-days: 14

      - name: Compare native source setup with frozen Go and process controls
        shell: bash
        run: scripts/setup-source-oracle/run.sh "$RUNNER_TEMP/setup-source-parity.json"

      - name: Upload source setup parity and negative controls
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-source-parity-${{ runner.os }}
          path: ${{ runner.temp }}/setup-source-parity*.json
          if-no-files-found: error
          retention-days: 14

      - name: Compare actual Linux Setup output boundaries and embedded writers
        shell: bash
        run: scripts/setup-output-oracle/run.sh "$RUNNER_TEMP/setup-output-parity"

      - name: Compare actual Linux Doctor stdout and embedded writer boundaries
        shell: bash
        run: scripts/doctor-stdout-oracle/run.sh "$RUNNER_TEMP/doctor-stdout-parity"

      - name: Preserve complete Doctor stdout observations and negative controls
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doctor-stdout-parity-${{ github.sha }}
          path: ${{ runner.temp }}/doctor-stdout-parity/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve complete Setup output observations and negative controls
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-output-parity-${{ github.sha }}
          path: ${{ runner.temp }}/setup-output-parity/
          if-no-files-found: error
          retention-days: 14

      # Keep the protocol subprocess contract visible and independently
      # executable. `rust-check` already covers this test, but a named gate
      # prevents stdout/lifecycle regressions from disappearing inside a
      # workspace-wide test log.
      - name: Native skills render drift and frozen Go baseline
        shell: bash
        run: scripts/skills-render-drift/run.sh "$RUNNER_TEMP/skills-render-drift.json"

      - name: Upload native skills render drift evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skills-render-drift-${{ runner.os }}
          path: ${{ runner.temp }}/skills-render-drift.json
          if-no-files-found: error
          retention-days: 14

      - name: Rust MCP stdio and lifecycle gate
        run: cargo test -p symbrain-cli --test mcp_cli_tests --locked

      # Compare the shipped Go and native Rust executables across raw MCP
      # frames, a hermetic stdio child, malformed frames, CLI failures and
      # SIGTERM while stdin remains open.
      - name: Go/Rust MCP executable differential gate
        run: |
          go build -o "$RUNNER_TEMP/symbrain-go-mcp" ./cmd/symbrain
          cargo build -p symbrain-cli --bin symbrain --locked
          python3 scripts/mcp-differential.py "$RUNNER_TEMP/symbrain-go-mcp" target/debug/symbrain

      - name: Native standalone Guard process contracts
        shell: bash
        run: scripts/guard-standalone-oracle/run.sh "$RUNNER_TEMP/guard-standalone.json"

      - name: Upload native standalone Guard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guard-standalone-${{ runner.os }}
          path: |
            ${{ runner.temp }}/guard-standalone.json
            ${{ runner.temp }}/guard-standalone-controls.json
            ${{ runner.temp }}/guard-standalone-raw-paths.json
            ${{ runner.temp }}/guard-standalone-doctor-boundaries.json
            ${{ runner.temp }}/guard-standalone-config-warnings.json
            ${{ runner.temp }}/guard-standalone-config-paths.json
            ${{ runner.temp }}/guard-standalone-command-tree.json
            ${{ runner.temp }}/guard-standalone-scan-boundaries.json
            ${{ runner.temp }}/guard-standalone-config-paths.json.progress.json
            ${{ runner.temp }}/guard-standalone-windows-path-reference.json
            ${{ runner.temp }}/guard-standalone-windows-path-reference-artifacts/
            ${{ runner.temp }}/guard-standalone-binaries/
          if-no-files-found: error
          retention-days: 14

      - name: Native Go/Rust activity validation acceptance
        shell: bash
        run: scripts/activity-validation-oracle/run.sh "$RUNNER_TEMP/activity-validation-767.json"

      - name: Preserve native activity validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: activity-validation-767-${{ runner.os }}
          path: |
            ${{ runner.temp }}/activity-validation-767.json
            ${{ runner.temp }}/activity-validation-767.json.fixture.json
            ${{ runner.temp }}/activity-validation-767.json.controls.json
          if-no-files-found: error
          retention-days: 14

      - name: Go/Rust native setup repair process parity
        shell: bash
        run: scripts/setup-repair-oracle/run.sh "$RUNNER_TEMP/setup-repair-parity.json"

      - name: Preserve setup repair process parity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-repair-parity-${{ runner.os }}
          path: ${{ runner.temp }}/setup-repair-parity.json
          if-no-files-found: error
          retention-days: 14

      - name: Go/Rust native config and harness process parity
        shell: bash
        run: scripts/config-harness-oracle/run.sh "$RUNNER_TEMP/config-harness-parity.json"

      - name: Preserve config and harness process parity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: config-harness-parity-${{ runner.os }}
          path: ${{ runner.temp }}/config-harness-parity.json
          if-no-files-found: error
          retention-days: 14

      - name: Credentialed usage requests, report JSON and table parity
        shell: bash
        run: scripts/usage-fetch-oracle/run.sh "$RUNNER_TEMP/usage-fetch-620.json"

      - name: Preserve credentialed usage process evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usage-fetch-620-${{ runner.os }}
          path: ${{ runner.temp }}/usage-fetch-620.json
          if-no-files-found: error
          retention-days: 14

      - name: Native usage credential reference and CLI parity
        shell: bash
        run: scripts/usage-credential-oracle/run.sh "$RUNNER_TEMP/usage-credential-768.json"

      - name: Preserve usage credential reference process evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usage-credential-768-${{ runner.os }}
          path: |
            ${{ runner.temp }}/usage-credential-768.json
            ${{ runner.temp }}/usage-credential-768.evidence
          if-no-files-found: error
          retention-days: 14

      - name: Native Claude and Codex credential file process parity
        shell: bash
        run: bash scripts/usage-provider-files-oracle/run.sh "$RUNNER_TEMP/usage-provider-files-768.json"

      - name: Preserve provider file and filesystem evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usage-provider-files-768-${{ runner.os }}
          path: |
            ${{ runner.temp }}/usage-provider-files-768.json
            ${{ runner.temp }}/usage-provider-files-768.evidence
          if-no-files-found: error
          retention-days: 14

      - name: Native read-only Copilot and Kimi file process parity
        shell: bash
        run: bash scripts/usage-copilot-kimi-oracle/run.sh "$RUNNER_TEMP/usage-copilot-kimi-768.json"
      - name: Preserve Copilot and Kimi process evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usage-copilot-kimi-768-${{ runner.os }}
          path: |
            ${{ runner.temp }}/usage-copilot-kimi-768.json
            ${{ runner.temp }}/usage-copilot-kimi-768.evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Native Usage Retry-After SDK and full TLS constructor parity
        shell: bash
        run: bash scripts/usage-retry-after-oracle/run.sh "$RUNNER_TEMP/usage-retry-after-768.json"
      - name: Preserve Retry-After SDK and full TLS process evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usage-retry-after-768-${{ runner.os }}
          path: |
            ${{ runner.temp }}/usage-retry-after-768.json
            ${{ runner.temp }}/usage-retry-after-768.evidence
          if-no-files-found: error
          retention-days: 14
      - name: Native Usage additive long-decimal SDK and full TLS parity
        shell: bash
        run: bash scripts/usage-retry-after-oracle/run.sh "$RUNNER_TEMP/usage-retry-decimal-768.json" --decimal
      - name: Preserve additive long-decimal SDK and TLS evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usage-retry-decimal-768-${{ runner.os }}
          path: |
            ${{ runner.temp }}/usage-retry-decimal-768.json
            ${{ runner.temp }}/usage-retry-decimal-768.evidence
          if-no-files-found: error
          retention-days: 14
      - name: Native Usage early-argv device and real TLS status parity
        shell: bash
        run: bash scripts/usage-next-oracle/run.sh "$RUNNER_TEMP/usage-next-768.json"
      - name: Preserve Usage successor full process evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usage-next-768-${{ runner.os }}
          path: |
            ${{ runner.temp }}/usage-next-768.json
            ${{ runner.temp }}/usage-next-768.evidence
          if-no-files-found: error
          retention-days: 14
      - name: Native read-only Hermes file and JWT process parity
        shell: bash
        run: scripts/usage-hermes-oracle/run.sh "$RUNNER_TEMP/usage-hermes-768.json"

      - name: Preserve Hermes credential and filesystem evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usage-hermes-768-${{ runner.os }}
          path: |
            ${{ runner.temp }}/usage-hermes-768.json
            ${{ runner.temp }}/usage-hermes-768.evidence
          if-no-files-found: error
          retention-days: 14

      - name: Go/Rust vault administration process parity
        run: |
          python3 -m unittest discover -s scripts/vault-admin-oracle -p test_replay.py -v
          python3 scripts/vault-admin-oracle/replay.py --go-ref dcddcef0df5789123c7c9a7ebe6e01f10e941f2c --rust target/debug/symbrain --out "$RUNNER_TEMP/vault-admin-parity.json"

      - name: Preserve vault process parity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vault-admin-parity-${{ runner.os }}
          path: ${{ runner.temp }}/vault-admin-parity.json
          if-no-files-found: error
          retention-days: 7

  # Keep raw invalid-UTF-8 diagnostics and persisted audit fields pinned to
  # the immutable Go 1.26.7 checkpoint using the real production binaries.
  # native_repair.py also checks the checked-in fixture byte-for-byte against
  # a fresh run from that archive; it never rewrites the fixture.
  guard-decide-raw-byte:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: false
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Independent Rust trust-anchor gate
        run: |
          cargo test --manifest-path Cargo.toml --locked -p symbrain-guard-core --test external_repair
          cargo test --manifest-path Cargo.toml --locked -p symbrain-cli --test guard_decide_raw_bytes
      - name: Execute raw-byte production-binary corpus
        env:
          GUARD_REPAIR_OUTPUT: ${{ runner.temp }}/guard-raw-byte
        run: python3 guard/scripts/guard-decide-oracle/native_repair.py
      - name: Retain raw-byte evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guard-raw-byte-${{ github.sha }}
          path: |
            ${{ runner.temp }}/guard-raw-byte/*.json
            ${{ runner.temp }}/guard-raw-byte/*.log
          if-no-files-found: error
          retention-days: 14

  # The migration's Rust CLI contains filesystem, process, and stdio paths
  # whose macOS behavior cannot be established by Linux CI or cross-builds.
  # Retained platform-specific source remains tracked in the contract matrix;
  # portable Go-oracle launcher and native runner coverage are available.
  rust-migration-macos:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Oracle generators verify the pinned rollback baseline.
          fetch-depth: 0

      - name: Set up Go oracle
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust quality dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: rust-quality-install-meta-v2-${{ runner.os }}-${{ runner.arch }}-toolchain-${{ hashFiles('rust-toolchain.toml') }}-lock-${{ hashFiles('Cargo.lock') }}-audit-0.22.2-deny-0.20.2

      - name: Install pinned Rust audit tools
        shell: sh
        run: |
          set -eu
          audit_version="$(cargo-audit --version 2>/dev/null || true)"
          if [ "$audit_version" != "cargo-audit 0.22.2" ]; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
          deny_version="$(cargo-deny --version 2>/dev/null || true)"
          if [ "$deny_version" != "cargo-deny 0.20.2" ]; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi

      - name: Rust quality and Go parity gates on macOS
        run: make rust-check parity-smoke

      - name: Go/Rust native doctor repair and negative process controls
        shell: bash
        run: scripts/doctor-repair-oracle/run.sh "$RUNNER_TEMP/doctor-repair-parity.json"

      - name: Preserve doctor repair process parity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doctor-repair-parity-${{ runner.os }}
          path: ${{ runner.temp }}/doctor-repair-parity*.json
          if-no-files-found: error
          retention-days: 14

      - name: Compare native source setup with frozen Go and process controls
        shell: bash
        run: scripts/setup-source-oracle/run.sh "$RUNNER_TEMP/setup-source-parity.json"

      - name: Upload source setup parity and negative controls
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-source-parity-${{ runner.os }}
          path: ${{ runner.temp }}/setup-source-parity*.json
          if-no-files-found: error
          retention-days: 14

      - name: Native skills render drift and frozen Go baseline
        shell: bash
        run: scripts/skills-render-drift/run.sh "$RUNNER_TEMP/skills-render-drift.json"

      - name: Upload native skills render drift evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skills-render-drift-${{ runner.os }}
          path: ${{ runner.temp }}/skills-render-drift.json
