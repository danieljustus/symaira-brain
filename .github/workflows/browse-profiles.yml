name: Browse browser-profile parity

on:
  pull_request:
    paths:
      - 'browse/**'
      - '.github/workflows/browse-profiles.yml'
  push:
    branches: [main]
    paths:
      - 'browse/**'
      - '.github/workflows/browse-profiles.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  profiles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: browse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Compare native browser-profile discovery and output
        # Read-only discovery in synthetic HOME/USERPROFILE/XDG/LOCALAPPDATA roots,
        # compared with the frozen Go observations.
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: cargo test -p symbrowse-cli --test profiles --all-features --locked -- --nocapture
      - name: Retain synthetic fixtures and exact CLI streams
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browse-profiles-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/symbrowse-profiles-*
          if-no-files-found: warn
          retention-days: 14
