name: Rust workspace coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go for existing executable contracts
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve the pinned Rust and LLVM tools
        run: |
          rustup show active-toolchain
          rustup component add llvm-tools-preview

      - name: Cache coverage tool dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'rust/coverage-policy.json') }}

      - name: Install the pinned coverage tool
        run: cargo install cargo-llvm-cov --version 0.6.21 --locked

      - name: Coverage failure and denominator controls
        run: python3 -m unittest discover -s scripts/rust-coverage -p test_reports.py -v

      - name: Enforce the complete Rust workspace floor
        run: make rust-coverage

      - name: Report the full denominator and per-crate diagnostics
        if: always()
        run: python3 scripts/rust-coverage/report.py --report target/coverage/rust.json --summary target/coverage/summary.json --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-${{ github.sha }}
          path: target/coverage/*.json
          if-no-files-found: error
          retention-days: 14
