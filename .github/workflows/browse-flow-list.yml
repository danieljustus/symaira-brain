name: Browse flow-list parity

on:
  pull_request:
    paths:
      - 'browse/**'
      - '.github/workflows/browse-flow-list.yml'
  push:
    branches: [main]
    paths:
      - 'browse/**'
      - '.github/workflows/browse-flow-list.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  flow-list:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: browse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Compare isolated empty and populated flow discovery
        # Replays the frozen Go flow-list observations in disposable per-case roots.
        env:
          TMPDIR: ${{ runner.temp }}
        run: cargo test -p symbrowse-cli --test flow_list --locked -- --nocapture
