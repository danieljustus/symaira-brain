# Reports when a pinned core version in
# rust/symbrain-managed/assets/manifest.json has fallen behind its repo's
# latest GitHub release. Every pin is maintained by hand (a bump requires
# independently downloading and hashing the release archive, not copying a
# value out of checksums.txt), so nothing here bumps the manifest
# automatically; it only reports drift for a human to act on.

name: Manifest Drift Check

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check manifest drift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/manifest-drift-check.py
