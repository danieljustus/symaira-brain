name: Memory HTTP native owner parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'rust/symbrain-memory/**'
      - 'scripts/memory-http-oracle/**'
      - '.github/workflows/memory-http-native.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]
    paths:
      - 'rust/symbrain-memory/**'
      - 'scripts/memory-http-oracle/**'
      - '.github/workflows/memory-http-native.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  owner:
    name: memory HTTP owner (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
      - name: Build and verify native owner
        run: |
          set -euo pipefail
          umask 022
          cargo fmt --all -- --check
          cargo build -p symbrain-memory --example http_probe --locked
          cargo test -p symbrain-memory --all-targets --all-features --locked
          cargo clippy -p symbrain-memory --all-targets --all-features --locked -- -D warnings
      - name: Install owned DOM test runtime and execute actual native gates
        run: |
          set -euo pipefail
          umask 022
          task_scratch="$RUNNER_TEMP/memory-http-dom-runtime"
          mkdir -p "$task_scratch"
          npm install --prefix "$task_scratch" --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          export MEMORY_HTTP_NODE="$(command -v node)"
          export MEMORY_HTTP_SCRATCH="$task_scratch"
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          suffix = '.exe' if os.name == 'nt' else ''
          native = Path('target/debug/examples/http_probe' + suffix).resolve()
          node = Path(os.environ['MEMORY_HTTP_NODE'])
          scratch = Path(os.environ['MEMORY_HTTP_SCRATCH'])
          if os.name == 'nt':
              node = Path(subprocess.check_output(['cygpath', '-w', str(node)], text=True).strip())
              scratch = Path(subprocess.check_output(['cygpath', '-w', str(scratch)], text=True).strip())
          subprocess.run(['python3', 'scripts/memory-http-oracle/run.py', '--native', str(native), '--node', str(node), '--jsdom', str(scratch / 'node_modules/jsdom'), '--report-dir', str(Path(os.environ['RUNNER_TEMP']) / 'memory-http-proof')], check=True)
          PY
      - name: Retain complete native acceptance receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memory-http-${{ matrix.runner }}-${{ github.sha }}
          path: ${{ runner.temp }}/memory-http-*
          if-no-files-found: error
          retention-days: 14
