# Rust release candidate pipeline (#730). Builds the six release archives with
# the Rust CLI and its packaged Go fallback, verifies them against the release
# archive contract and smoke-tests each one on its native platform.
#
# This pipeline never creates a tag, release or tap update: the published v*
# release is still produced by release.yml from GoReleaser. Making the Rust
# archives the default release is #782. Signing is opt-in (`sign` input).

name: Rust release candidate

on:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize the candidate (submits to Apple, writes to the public Rekor log)
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rust-release.yml"
      - "scripts/rust-release/**"
      - "scripts/dist-oracle/**"

permissions:
  contents: read

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      epoch: ${{ steps.version.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Determine unpublished candidate version
        id: version
        run: |
          set -euo pipefail
          base="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          sha="$(git rev-parse HEAD)"
          {
            echo "version=${base}-candidate.${sha:0:12}"
            echo "epoch=$(git show -s --format=%ct HEAD)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc floor at 2.35 for the dynamically linked CLI.
          - { os: linux, arch: amd64, runner: ubuntu-22.04 }
          - { os: linux, arch: arm64, runner: ubuntu-22.04-arm }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: windows, arch: amd64, runner: windows-2025 }
          - { os: windows, arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.version.outputs.epoch }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      EXE: ${{ matrix.os == 'windows' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Build Rust CLI
        env:
          SYMBRAIN_VERSION: ${{ env.VERSION }}
        run: cargo build --locked --release -p symbrain-cli

      - name: Build Go fallback
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$RUNNER_TEMP/symbrain-go$EXE" ./cmd/symbrain

      - name: Package archive
        run: >-
          python scripts/rust-release/package.py archive --version "$VERSION"
          --os "${{ matrix.os }}" --arch "${{ matrix.arch }}"
          --rust "target/release/symbrain$EXE" --go "$RUNNER_TEMP/symbrain-go$EXE"
          --out "$RUNNER_TEMP/dist"

      - name: Smoke-test the extracted archive
        run: python scripts/rust-release/smoke.py --archive-dir "$RUNNER_TEMP/dist" --version "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-release-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 14

  bundle:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-release-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      - name: Write checksums
        run: python3 scripts/rust-release/package.py checksums --dir "$RUNNER_TEMP/dist"

      - name: Verify the archive contract for all six platforms
        run: go run ./scripts/dist-oracle -hybrid-candidate-check -platforms all -version "$VERSION" -assets "$RUNNER_TEMP/dist"

      - name: Render Homebrew formula and Scoop manifest (not published)
        run: python3 scripts/rust-release/manifests.py --version "$VERSION" --checksums "$RUNNER_TEMP/dist/checksums.txt" --out "$RUNNER_TEMP/manifests"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate CycloneDX SBOMs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sbom"
          for archive in "$RUNNER_TEMP"/dist/symbrain_*; do
            name="$(basename "$archive")"
            syft "$archive" --output "cyclonedx-json=$RUNNER_TEMP/sbom/$name.sbom.json"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["bomFormat"]=="CycloneDX" and d.get("components"), sys.argv[1]' "$RUNNER_TEMP/sbom/$name.sbom.json"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-release-candidate-${{ needs.version.outputs.version }}
          path: |
            ${{ runner.temp }}/dist/
            ${{ runner.temp }}/sbom/
            ${{ runner.temp }}/manifests/
          if-no-files-found: error
          retention-days: 14

  # Opt-in signing of the candidate bundle. Only on manual dispatch with
  # sign=true: it uses the release environment's signing secrets, submits the
  # darwin binaries to Apple and writes cosign entries to the public Rekor
  # transparency log. It still creates no tag, release or tap update.
  sign:
    if: github.event_name == 'workflow_dispatch' && inputs.sign
    needs: [version, bundle]
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      id-token: write # keyless cosign
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.version.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-release-candidate-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/candidate

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for secret in CERTIFICATE_P12 CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!secret:-}" ]; then
              echo "::error::$secret must be configured in the release environment."
              exit 1
            fi
          done
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TEAM_ID=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*(\([A-Z0-9]*\)).*/\1/')
          if [ -z "$IDENTITY" ] || [[ ! "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::No Developer ID Application identity found."
            exit 1
          fi
          {
            echo "CODESIGN_IDENTITY=$IDENTITY"
            echo "TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Sign, notarize and repackage the darwin binaries
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          for secret in NOTARY_API_KEY NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID; do
            if [ -z "${!secret:-}" ]; then
              echo "::error::$secret must be configured in the release environment."
              exit 1
            fi
          done
          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$NOTARY_API_KEY" | base64 --decode -o "$API_KEY_PATH"
          export API_KEY_PATH
          dist="$RUNNER_TEMP/candidate/dist"
          for arch in amd64 arm64; do
            archive="$dist/symbrain_${VERSION}_darwin_${arch}.tar.gz"
            work="$RUNNER_TEMP/darwin-$arch"
            mkdir -p "$work"
            tar -xzf "$archive" -C "$work"
            for binary in symbrain symbrain-go; do
              identifier="com.symaira.brain.cli"
              if [ "$binary" = symbrain-go ]; then identifier="com.symaira.brain.cli-go"; fi
              codesign --force --options runtime --timestamp --identifier "$identifier" \
                --sign "$CODESIGN_IDENTITY" "$work/$binary"
              BIN_IDENTIFIER="$identifier" bash scripts/notarize-and-verify.sh \
                "$work/$binary" bin "$RUNNER_TEMP/notary-darwin-$arch-$binary"
            done
            rm "$archive"
            python scripts/rust-release/package.py archive --version "$VERSION" --os darwin --arch "$arch" \
              --rust "$work/symbrain" --go "$work/symbrain-go" --out "$dist"
          done
          python scripts/rust-release/package.py checksums --dir "$dist"
          go run ./scripts/dist-oracle -hybrid-candidate-check -platforms all -version "$VERSION" -assets "$dist"
          # The darwin digests changed, so render the tap files from the signed checksums.
          python scripts/rust-release/manifests.py --version "$VERSION" --checksums "$dist/checksums.txt" \
            --out "$RUNNER_TEMP/candidate/manifests"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Regenerate the darwin SBOMs
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            name="symbrain_${VERSION}_darwin_${arch}.tar.gz"
            syft "$RUNNER_TEMP/candidate/dist/$name" --output "cyclonedx-json=$RUNNER_TEMP/candidate/sbom/$name.sbom.json"
          done

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.4.3'

      - name: Sign every asset with cosign and verify the signatures
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/rust-release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          for asset in "$RUNNER_TEMP"/candidate/dist/* "$RUNNER_TEMP"/candidate/sbom/* "$RUNNER_TEMP"/candidate/manifests/*; do
            cosign sign-blob --yes --output-certificate "$asset.pem" --output-signature "$asset.sig" "$asset"
            cosign verify-blob --certificate "$asset.pem" --signature "$asset.sig" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$asset"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-release-signed-${{ needs.version.outputs.version }}
          path: |
            ${{ runner.temp }}/candidate/
            ${{ runner.temp }}/notary-*.json
          if-no-files-found: error
          retention-days: 14

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
