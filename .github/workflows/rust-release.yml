# Unpublished release candidate. Builds the six supported release archives
# (symbrain and symbrowse on each of the three native targets) exactly like
# release.yml, verifies them against the release archive contract and
# smoke-tests each one on its native platform. It never
# creates a tag, release or tap update and never signs; signing and publication
# happen only in release.yml on a v* tag.

name: Rust release candidate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rust-release.yml"
      - "scripts/rust-release/**"
      - "scripts/dist-oracle/**"

permissions:
  contents: read

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      epoch: ${{ steps.version.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Determine unpublished candidate version
        id: version
        run: |
          set -euo pipefail
          base="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          sha="$(git rev-parse HEAD)"
          {
            echo "version=${base}-candidate.${sha:0:12}"
            echo "epoch=$(git show -s --format=%ct HEAD)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc floor at 2.35 for the dynamically linked CLI.
          - { os: linux, arch: amd64, runner: ubuntu-22.04 }
          - { os: linux, arch: arm64, runner: ubuntu-22.04-arm }
          - { os: darwin, arch: arm64, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.version.outputs.epoch }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      EXE: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      # browse/ is its own Cargo workspace with its own pinned toolchain.
      - name: Resolve pinned Rust toolchain (browse)
        working-directory: browse
        run: rustup show active-toolchain

      # cargo-auditable embeds the locked dependency list in the binary; the
      # bundle job's Syft SBOM reads it (a plain Rust binary has no components).
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --version 0.7.7 --locked

      - name: Build Rust CLI
        env:
          SYMBRAIN_VERSION: ${{ env.VERSION }}
        run: cargo auditable build --locked --release -p symbrain-cli

      - name: Build symbrowse
        working-directory: browse
        env:
          SYMBROWSE_VERSION: ${{ env.VERSION }}
        run: cargo auditable build --locked --release -p symbrowse-cli

      - name: Package archives
        run: |
          set -euo pipefail
          python scripts/rust-release/package.py archive --version "$VERSION" \
            --os "${{ matrix.os }}" --arch "${{ matrix.arch }}" \
            --rust "target/release/symbrain$EXE" --out "$RUNNER_TEMP/dist"
          python scripts/rust-release/package.py archive --version "$VERSION" \
            --os "${{ matrix.os }}" --arch "${{ matrix.arch }}" --product symbrowse \
            --rust "browse/target/release/symbrowse$EXE" --out "$RUNNER_TEMP/dist"

      - name: Smoke-test the extracted archives
        run: |
          set -euo pipefail
          python scripts/rust-release/smoke.py --archive-dir "$RUNNER_TEMP/dist" --version "$VERSION"
          python scripts/rust-release/smoke.py --archive-dir "$RUNNER_TEMP/dist" --version "$VERSION" --product symbrowse

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-release-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 14

  bundle:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-release-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      - name: Verify release tooling
        run: python3 -m unittest discover -s scripts/rust-release -p 'test_*.py'

      - name: Write checksums
        run: python3 scripts/rust-release/package.py checksums --dir "$RUNNER_TEMP/dist"

      - name: Verify the archive contract for both products on all three supported platforms
        run: python3 scripts/rust-release/package.py verify --version "$VERSION" --dir "$RUNNER_TEMP/dist"

      - name: Render Homebrew formula (not published)
        run: python3 scripts/rust-release/manifests.py --version "$VERSION" --checksums "$RUNNER_TEMP/dist/checksums.txt" --out "$RUNNER_TEMP/manifests"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate CycloneDX SBOMs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sbom"
          for archive in "$RUNNER_TEMP"/dist/symbrain_* "$RUNNER_TEMP"/dist/symbrowse_*; do
            name="$(basename "$archive")"
            syft "$archive" --output "cyclonedx-json=$RUNNER_TEMP/sbom/$name.sbom.json"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["bomFormat"]=="CycloneDX" and d.get("components"), sys.argv[1]' "$RUNNER_TEMP/sbom/$name.sbom.json"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-release-candidate-${{ needs.version.outputs.version }}
          path: |
            ${{ runner.temp }}/dist/
            ${{ runner.temp }}/sbom/
            ${{ runner.temp }}/manifests/
          if-no-files-found: error
          retention-days: 14

