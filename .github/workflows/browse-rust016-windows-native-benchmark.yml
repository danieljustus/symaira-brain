name: Browse RUST-016 native benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "browse/**"
      - ".github/workflows/browse-rust016-windows-native-benchmark.yml"

permissions:
  contents: read

jobs:
  unix-native:
    name: Native benchmark ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: browse/go.mod

      - name: Measure native Go and Rust release binaries
        working-directory: browse
        shell: bash
        run: |
          set -euo pipefail
          go build -ldflags="-s -w" -o "$RUNNER_TEMP/symbrowse-go" ./cmd/symbrowse
          cargo build --release --locked --bin symbrowse
          cp target/release/symbrowse "$RUNNER_TEMP/symbrowse-rust"
          python3 port/bench/run.py \
            --go "$RUNNER_TEMP/symbrowse-go" \
            --rust "$RUNNER_TEMP/symbrowse-rust" \
            --output "$RUNNER_TEMP/browse-rust016-${{ matrix.target }}.json" \
            --runs 30 --strict
          python3 - "$RUNNER_TEMP/browse-rust016-${{ matrix.target }}.json" <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert report["source_revision"] == __import__("os").environ["GITHUB_SHA"]
          assert report["gate"] == "pass" and report["runs_per_workload"] == 30
          go, rust = report["binaries"]["go"], report["binaries"]["rust"]
          for workload in ("cli", "mcp", "daemon", "fetch"):
              left, right = go[workload], rust[workload]
              assert left["status"] == right["status"] == "pass", (workload, left, right)
              assert left["samples"] == right["samples"] == 30
              assert right["p95_duration_ns"] <= left["p95_duration_ns"] * 1.1, workload
          for variant in ("help", "config"):
              left, right = go["cli_variants"][variant], rust["cli_variants"][variant]
              assert left["status"] == right["status"] == "pass", variant
              assert left["samples"] == right["samples"] == 30
              assert right["p95_duration_ns"] <= left["p95_duration_ns"] * 1.1, variant
          left, right = go["daemon"]["steady_state_100_frames"], rust["daemon"]["steady_state_100_frames"]
          assert left["status"] == right["status"] == "pass"
          assert left["samples"] == right["samples"] == 30
          assert right["p95_duration_ns"] <= left["p95_duration_ns"] * 1.1
          size_gain = 1 - report["candidate_size_bytes"] / report["reference_size_bytes"]
          print(f"native value gate: size gain {size_gain:.1%}")
          assert size_gain >= 0.2
          PY

      - name: Upload native benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browse-rust016-${{ matrix.target }}
          path: ${{ runner.temp }}/browse-rust016-${{ matrix.target }}.json
          if-no-files-found: warn

  windows-native:
    name: Native benchmark ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: browse/go.mod
          cache: true
          cache-dependency-path: browse/go.sum

      - name: Resolve pinned Rust toolchain
        working-directory: browse
        run: rustup show active-toolchain

      - name: Build Go and Rust release binaries
        working-directory: browse
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          go build -ldflags="-s -w" -o "$env:RUNNER_TEMP\symbrowse-go.exe" ./cmd/symbrowse
          cargo build --release --locked --bin symbrowse
          Copy-Item "target\release\symbrowse.exe" "$env:RUNNER_TEMP\symbrowse-rust.exe"

      - name: Run native 30-sample CLI, MCP, daemon, and static-fetch probes
        working-directory: browse
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import pathlib, socket, tempfile
          with tempfile.TemporaryDirectory(prefix="sb-unix-") as directory:
              path = pathlib.Path(directory, "probe.sock")
              try:
                  with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as listener:
                      listener.bind(str(path))
                  print("Windows AF_UNIX bind: pass")
              except OSError as error:
                  print(f"Windows AF_UNIX bind: unavailable ({error})")
          '@ | python -
          python port/bench/run.py `
            --go "$env:RUNNER_TEMP\symbrowse-go.exe" `
            --rust "$env:RUNNER_TEMP\symbrowse-rust.exe" `
            --output "$env:RUNNER_TEMP\browse-rust016-windows.json" `
            --runs 30
          if ($LASTEXITCODE -ne 0) { throw "benchmark runner failed: $LASTEXITCODE" }
          @'
          import json, os, pathlib
          report = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "browse-rust016-windows.json").read_text())
          assert report["host"]["system"] == "Windows", report["host"]
          assert report["runs_per_workload"] == 30
          go, rust = report["binaries"]["go"], report["binaries"]["rust"]
          for workload in ("cli", "mcp", "daemon", "fetch"):
              left, right = go[workload], rust[workload]
              assert left["status"] == right["status"] == "pass", (workload, left, right)
              assert left["samples"] == right["samples"] == 30
              assert right["p95_duration_ns"] <= left["p95_duration_ns"] * 1.1, workload
          for variant in ("help", "config"):
              left, right = go["cli_variants"][variant], rust["cli_variants"][variant]
              assert left["status"] == right["status"] == "pass", variant
              assert left["samples"] == right["samples"] == 30
              assert right["p95_duration_ns"] <= left["p95_duration_ns"] * 1.1, variant
          left, right = go["daemon"]["steady_state_100_frames"], rust["daemon"]["steady_state_100_frames"]
          assert left["status"] == right["status"] == "pass"
          assert left["samples"] == right["samples"] == 30
          assert right["p95_duration_ns"] <= left["p95_duration_ns"] * 1.1
          assert report["gate"] == "pass", report["gate"]
          assert report["candidate_size_bytes"] <= report["reference_size_bytes"] * 0.8
          '@ | python -

      - name: Upload native benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browse-rust016-${{ matrix.runner }}
          path: ${{ runner.temp }}\browse-rust016-windows.json
          if-no-files-found: warn

  require-six-native-reports:
    name: Require six exact-SHA native benchmark reports
    if: always()
    needs: [unix-native, windows-native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Keep the benchmark gate red unless all six native jobs passed
        env:
          UNIX_RESULT: ${{ needs.unix-native.result }}
          WINDOWS_RESULT: ${{ needs.windows-native.result }}
        run: |
          if [[ "$UNIX_RESULT" != success || "$WINDOWS_RESULT" != success ]]; then
            echo "Native benchmark matrices: Unix=$UNIX_RESULT Windows=$WINDOWS_RESULT" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Download benchmark artifacts from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: browse-rust016-*
          path: ${{ runner.temp }}/browse-rust016-reports
          merge-multiple: false

      - name: Verify six target identities, source SHA, and paired value gates
        working-directory: browse
        env:
          REPORT_ROOT: ${{ runner.temp }}/browse-rust016-reports
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          expected = {
              "browse-rust016-darwin-amd64": ("Darwin", {"x86_64"}),
              "browse-rust016-darwin-arm64": ("Darwin", {"arm64"}),
              "browse-rust016-linux-amd64": ("Linux", {"x86_64"}),
              "browse-rust016-linux-arm64": ("Linux", {"aarch64", "arm64"}),
              "browse-rust016-windows-2025": ("Windows", {"amd64", "x86_64"}),
              "browse-rust016-windows-11-arm": ("Windows", {"arm64", "aarch64"}),
          }
          root = Path(os.environ["REPORT_ROOT"])
          artifacts = {path.name for path in root.iterdir() if path.is_dir()}
          if artifacts != set(expected):
              raise SystemExit(f"expected exactly six native reports, got {sorted(artifacts)}")

          for artifact, (system, machines) in expected.items():
              files = sorted((root / artifact).glob("*.json"))
              if len(files) != 1:
                  raise SystemExit(f"{artifact} must contain exactly one report, got {files}")
              report = json.loads(files[0].read_text(encoding="utf-8"))
              host = report.get("host", {})
              if host.get("system") != system or str(host.get("machine", "")).casefold() not in machines:
                  raise SystemExit(f"{artifact} host identity mismatch: {host}")
              if report.get("source_revision") != os.environ["GITHUB_SHA"]:
                  raise SystemExit(f"{artifact} source revision does not match this workflow SHA")
              if report.get("runs_per_workload") != 30 or report.get("gate") != "pass":
                  raise SystemExit(f"{artifact} benchmark did not pass 30-sample execution gate")
              binaries = report.get("binaries", {})
              for implementation in ("go", "rust"):
                  identity = binaries.get(implementation, {}).get("identity", {})
                  digest = identity.get("sha256", "")
                  if not re.fullmatch(r"[0-9a-f]{64}", digest):
                      raise SystemExit(f"{artifact} has no SHA-256 identity for {implementation}")
              comparison = subprocess.run(
                  [sys.executable, "port/bench/compare.py", "docs/rust-port/baseline.json", str(files[0])],
                  check=False, capture_output=True, text=True,
              )
              print(comparison.stdout, end="")
              if comparison.returncode:
                  raise SystemExit(f"{artifact} failed paired p95/value gate: {comparison.stderr}")
          print(f"six native RUST-016 reports verified for {os.environ['GITHUB_SHA']}")
          PY
