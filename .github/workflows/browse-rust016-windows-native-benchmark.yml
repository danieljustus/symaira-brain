name: Browse RUST-016 native benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "browse/**"
      - ".github/workflows/browse-rust016-windows-native-benchmark.yml"

permissions:
  contents: read

jobs:
  unix-native:
    name: Native benchmark ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: browse/go.mod

      - name: Measure native Go and Rust release binaries
        working-directory: browse
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/symbrowse-go" ./cmd/symbrowse
          cargo build --release --locked --bin symbrowse
          cp target/release/symbrowse "$RUNNER_TEMP/symbrowse-rust"
          python3 port/bench/run.py \
            --go "$RUNNER_TEMP/symbrowse-go" \
            --rust "$RUNNER_TEMP/symbrowse-rust" \
            --output "$RUNNER_TEMP/browse-rust016-${{ matrix.target }}.json" \
            --runs 30 --strict
          python3 - "$RUNNER_TEMP/browse-rust016-${{ matrix.target }}.json" <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert report["source_revision"] == __import__("os").environ["GITHUB_SHA"]
          assert report["gate"] == "pass" and report["runs_per_workload"] == 30
          go, rust = report["binaries"]["go"], report["binaries"]["rust"]
          for workload in ("cli", "mcp", "daemon", "fetch"):
              left, right = go[workload], rust[workload]
              assert left["status"] == right["status"] == "pass", (workload, left, right)
              assert left["samples"] == right["samples"] == 30
              assert right["p95_duration_ns"] <= left["p95_duration_ns"] * 1.1, workload
          for variant in ("help", "config"):
              left, right = go["cli_variants"][variant], rust["cli_variants"][variant]
              assert left["status"] == right["status"] == "pass", variant
              assert left["samples"] == right["samples"] == 30
              assert right["p95_duration_ns"] <= left["p95_duration_ns"] * 1.1, variant
          left, right = go["daemon"]["steady_state_100_frames"], rust["daemon"]["steady_state_100_frames"]
          assert left["status"] == right["status"] == "pass"
          assert left["samples"] == right["samples"] == 30
          assert right["p95_duration_ns"] <= left["p95_duration_ns"] * 1.1
          size_gain = 1 - report["candidate_size_bytes"] / report["reference_size_bytes"]
          print(f"native value gate: size gain {size_gain:.1%}")
          assert size_gain >= 0.2
          PY

      - name: Upload native benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browse-rust016-${{ matrix.target }}
          path: ${{ runner.temp }}/browse-rust016-${{ matrix.target }}.json
          if-no-files-found: warn

  windows-native:
    name: Native benchmark ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: browse/go.mod
          cache: true
          cache-dependency-path: browse/go.sum

      - name: Resolve pinned Rust toolchain
        working-directory: browse
        run: rustup show active-toolchain

      - name: Build Go and Rust release binaries
        working-directory: browse
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          go build -o "$env:RUNNER_TEMP\symbrowse-go.exe" ./cmd/symbrowse
          cargo build --release --locked --bin symbrowse
          Copy-Item "target\release\symbrowse.exe" "$env:RUNNER_TEMP\symbrowse-rust.exe"

      - name: Run native 30-sample CLI, MCP, daemon, and static-fetch probes
        working-directory: browse
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python port/bench/run.py `
            --go "$env:RUNNER_TEMP\symbrowse-go.exe" `
            --rust "$env:RUNNER_TEMP\symbrowse-rust.exe" `
            --output "$env:RUNNER_TEMP\browse-rust016-windows.json" `
            --runs 30
          if ($LASTEXITCODE -ne 0) { throw "benchmark runner failed: $LASTEXITCODE" }
          @'
          import json, os, pathlib
          report = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "browse-rust016-windows.json").read_text())
          assert report["host"]["system"] == "Windows", report["host"]
          assert report["runs_per_workload"] == 30
          go, rust = report["binaries"]["go"], report["binaries"]["rust"]
          for workload in ("cli", "mcp", "daemon", "fetch"):
              left, right = go[workload], rust[workload]
              assert left["status"] == right["status"] == "pass", (workload, left, right)
              assert left["samples"] == right["samples"] == 30
              assert right["p95_duration_ns"] <= left["p95_duration_ns"] * 1.1, workload
          for variant in ("help", "config"):
              left, right = go["cli_variants"][variant], rust["cli_variants"][variant]
              assert left["status"] == right["status"] == "pass", variant
              assert left["samples"] == right["samples"] == 30
              assert right["p95_duration_ns"] <= left["p95_duration_ns"] * 1.1, variant
          left, right = go["daemon"]["steady_state_100_frames"], rust["daemon"]["steady_state_100_frames"]
          assert left["status"] == right["status"] == "pass"
          assert left["samples"] == right["samples"] == 30
          assert right["p95_duration_ns"] <= left["p95_duration_ns"] * 1.1
          assert report["gate"] == "pass", report["gate"]
          assert report["candidate_size_bytes"] <= report["reference_size_bytes"] * 0.8
          '@ | python -

      - name: Upload native benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browse-rust016-${{ matrix.runner }}
          path: ${{ runner.temp }}\browse-rust016-windows.json
          if-no-files-found: warn
