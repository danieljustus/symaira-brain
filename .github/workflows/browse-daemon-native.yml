name: Browse daemon native parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'browse/**'
      - '.github/workflows/browse-daemon-native.yml'
  push:
    branches: [main]
    paths:
      - 'browse/**'
      - '.github/workflows/browse-daemon-native.yml'

jobs:
  daemon:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: browse
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # fixture generators verify the pinned Go source commit
      - name: Verify pinned toolchain
        run: rustup show active-toolchain
      - name: Smoke native Rust CLI release build
        run: |
          cargo build -p symbrowse-cli --bin symbrowse --release --locked
          executable=target/release/symbrowse
          if [[ "$RUNNER_OS" == Windows ]]; then executable+=.exe; fi
          "$executable" version --json
          "$executable" --help
      - name: Set up Go oracle
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: browse/go.mod
      - name: Test daemon contracts
        run: cargo test --manifest-path Cargo.toml -p symbrowse-daemon --test protocol_fixture --test lifecycle --test cancellation --test platform --locked
      - name: Exercise daemon lifecycle and races
        run: |
          python3 port/harness/run.py --suite daemon
          python3 port/harness/run.py --suite daemon-races --repeat 50
      - name: Exercise static fetch, engine, and workflow contracts
        run: |
          python3 port/harness/run.py --suite fetch-control
          python3 port/harness/run.py --suite fetch-render --comparison bytes
          python3 scripts/rust-port/engine_fixture_gen.py --check
          cargo test -p symbrowse-engine --all-targets --locked
          go run ./scripts/rust-port/cmd/workflowgen --check
          cargo test -p symbrowse-core --test workflows_contract --locked
