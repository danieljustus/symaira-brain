name: Browse daemon native parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'browse/**'
      - '.github/workflows/browse-daemon-native.yml'
  push:
    branches: [main]
    paths:
      - 'browse/**'
      - '.github/workflows/browse-daemon-native.yml'

permissions:
  contents: read

jobs:
  daemon:
    name: daemon (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: browse
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve pinned supplemental Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: false

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Build the Rust CLI
        run: |
          set -euo pipefail
          cargo build -p symbrowse-cli --bin symbrowse --release --locked
          cargo build -p symbrowse-core --example state_key_store_probe --example startup_key_source_probe --release --locked

      - name: Verify native daemon and workspace lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Verify daemon platform and lifecycle contracts
        run: |
          set -euo pipefail
          python3 port/harness/key_test_environment.py -- cargo test -p symbrowse-daemon --locked 2>&1 | tee "$RUNNER_TEMP/browse-daemon-unit.log"

      - name: Require Windows client cancellation and eight-client contracts
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          cargo test -p symbrowse-daemon --test windows_client_deadlines --locked \
            native_windows_client_deadlines -- --ignored --exact --nocapture \
            2>&1 | tee "$RUNNER_TEMP/browse-daemon-client-deadlines.log"

      - name: Exercise native daemon lifecycle and races
        env:
          SYMBROWSE_RUST_BINARY: ${{ github.workspace }}/browse/target/release/symbrowse${{ runner.os == 'Windows' && '.exe' || '' }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python3 port/harness/test_run.py DaemonExitTests 2>&1 | tee "$RUNNER_TEMP/browse-daemon-harness.log"
          python3 port/harness/test_windows_pipe.py 2>&1 | tee "$RUNNER_TEMP/browse-daemon-pipe-controls.log"
          python3 port/harness/test_registry_progress.py 2>&1 | tee "$RUNNER_TEMP/browse-daemon-registry-progress-tests.log"
          python3 port/harness/test_registry_cli_process.py 2>&1 | tee "$RUNNER_TEMP/browse-daemon-cli-capture-tests.log"
          python3 port/harness/test_registry_daemon_lifetime.py 2>&1 | tee "$RUNNER_TEMP/browse-daemon-owner-tests.log"
          python3 port/harness/test_raw_path_admission.py 2>&1 | tee "$RUNNER_TEMP/browse-daemon-raw-path-tests.log"
          python3 port/harness/run.py --suite daemon 2>&1 | tee "$RUNNER_TEMP/browse-daemon-lifecycle.log"
          python3 port/harness/run.py --suite daemon-races --repeat 50 2>&1 | tee "$RUNNER_TEMP/browse-daemon-races.log"

      - name: Compare immutable integrated Go and actual native daemon
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          oracle="$RUNNER_TEMP/browse-daemon-go-source"
          go_binary="$RUNNER_TEMP/symbrowse-daemon-go"
          rust_binary="$GITHUB_WORKSPACE/browse/target/release/symbrowse"
          if [ "${OS:-}" = Windows_NT ]; then
            go_binary="$(cygpath -m "$go_binary.exe")"
            rust_binary="$(cygpath -m "$rust_binary.exe")"
          fi
          git worktree add --detach "$oracle" dcddcef0df5789123c7c9a7ebe6e01f10e941f2c
          go -C "$oracle/browse" build -o "$go_binary" ./cmd/symbrowse
          python3 port/harness/daemon_process.py --go "$go_binary" --rust "$rust_binary" \
            --go-source "$oracle" --out "$RUNNER_TEMP/browse-daemon-process.json"
          python3 port/harness/daemon_registry.py --go "$go_binary" --rust "$rust_binary" \
            --go-source "$oracle" --out "$RUNNER_TEMP/browse-daemon-registry.json"
          store_probe="$GITHUB_WORKSPACE/browse/target/release/examples/state_key_store_probe"
          if [ "${OS:-}" = Windows_NT ]; then
            store_probe="$(cygpath -m "$store_probe.exe")"
          fi
          python3 port/harness/daemon_state_key.py --go "$go_binary" --rust "$rust_binary" \
            --rust-store-probe "$store_probe" --go-source "$oracle" \
            --out "$RUNNER_TEMP/browse-daemon-state-key.json" \
            2>&1 | tee "$RUNNER_TEMP/browse-daemon-state-key.log"
          source_probe="$GITHUB_WORKSPACE/browse/target/release/examples/startup_key_source_probe"
          if [ "${OS:-}" = Windows_NT ]; then
            source_probe="$(cygpath -m "$source_probe.exe")"
          fi
          python3 port/harness/daemon_state_key_ownership.py --rust "$rust_binary" \
            --rust-source-probe "$source_probe" \
            --out "$RUNNER_TEMP/browse-daemon-state-key-ownership.json" \
            2>&1 | tee "$RUNNER_TEMP/browse-daemon-state-key-ownership.log"
          python3 port/harness/daemon_provider_discovery.py --go "$go_binary" --rust "$rust_binary" \
            --go-source "$oracle" --rust-source-probe "$source_probe" \
            --out "$RUNNER_TEMP/browse-daemon-provider-discovery.json" \
            2>&1 | tee "$RUNNER_TEMP/browse-daemon-provider-discovery.log"
          fixture_binary="$RUNNER_TEMP/symbrowse-mcp-go-v0.8.0"
          if [ "${OS:-}" = Windows_NT ]; then
            fixture_binary="$(cygpath -m "$fixture_binary.exe")"
          fi
          go -C "$oracle/browse" build -ldflags '-X main.version=v0.8.0' -o "$fixture_binary" ./cmd/symbrowse
          python3 port/harness/daemon_mcp.py --go "$go_binary" --go-fixture "$fixture_binary" \
            --rust "$rust_binary" --go-source "$oracle" --workspace \
            --out "$RUNNER_TEMP/browse-daemon-mcp.json"

      - name: Retain exact-head daemon receipt
        if: always()
        env:
          RECEIPT: ${{ runner.temp }}/browse-daemon-${{ matrix.runner }}.txt
        run: |
          {
            echo "source_revision=$GITHUB_SHA"
            echo "runner=${{ matrix.runner }}"
            rustc -Vv
            cargo -V
            go version
          } > "$RECEIPT"
      - name: Upload native daemon receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browse-daemon-${{ matrix.runner }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/browse-daemon-${{ matrix.runner }}.txt
            ${{ runner.temp }}/browse-daemon-unit.log
            ${{ runner.temp }}/browse-daemon-harness.log
            ${{ runner.temp }}/browse-daemon-pipe-controls.log
            ${{ runner.temp }}/browse-daemon-registry-progress-tests.log
            ${{ runner.temp }}/browse-daemon-cli-capture-tests.log
            ${{ runner.temp }}/browse-daemon-owner-tests.log
            ${{ runner.temp }}/browse-daemon-raw-path-tests.log
            ${{ runner.temp }}/browse-daemon-client-deadlines.log
            ${{ runner.temp }}/browse-daemon-client-deadlines/**
            ${{ runner.temp }}/browse-daemon-lifecycle.log
            ${{ runner.temp }}/browse-daemon-races.log
            ${{ runner.temp }}/browse-daemon-process.json
            ${{ runner.temp }}/browse-daemon-registry.json
            ${{ runner.temp }}/browse-daemon-registry.raw.json
            ${{ runner.temp }}/browse-daemon-registry.progress.jsonl
            ${{ runner.temp }}/browse-daemon-registry.progress.cli/**
            ${{ runner.temp }}/browse-daemon-state-key.json
            ${{ runner.temp }}/browse-daemon-state-key.raw.json
            ${{ runner.temp }}/browse-daemon-state-key.log
            ${{ runner.temp }}/browse-daemon-state-key-ownership.json
            ${{ runner.temp }}/browse-daemon-state-key-ownership.log
            ${{ runner.temp }}/browse-daemon-provider-discovery.json
            ${{ runner.temp }}/browse-daemon-provider-discovery.raw.json
            ${{ runner.temp }}/browse-daemon-provider-discovery.log
            ${{ runner.temp }}/browse-daemon-mcp.json
            ${{ runner.temp }}/browse-daemon-mcp.json.tests.log
          if-no-files-found: error
          retention-days: 14
