name: Browse daemon native parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'browse/**'
      - '.github/workflows/browse-daemon-native.yml'
  push:
    branches: [main]
    paths:
      - 'browse/**'
      - '.github/workflows/browse-daemon-native.yml'

jobs:
  daemon:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: browse
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # fixture generators verify the pinned Go source commit
      - name: Verify pinned toolchain
        run: rustup show active-toolchain
      - name: Smoke native Rust CLI release build
        run: |
          cargo build -p symbrowse-cli --bin symbrowse --release --locked
          executable=target/release/symbrowse
          if [[ "$RUNNER_OS" == Windows ]]; then executable+=.exe; fi
          "$executable" version --json
          "$executable" --help
      - name: Set up Go oracle
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: browse/go.mod
      - name: Compare native Go and Rust Browse CLI cases
        run: |
          go_binary="$RUNNER_TEMP/symbrowse-go"
          rust_binary=target/release/symbrowse
          if [[ "$RUNNER_OS" == Windows ]]; then
            go_binary+=.exe
            rust_binary+=.exe
          fi
          go build -o "$go_binary" ./cmd/symbrowse
          python3 port/harness/cli_differential.py --skip-help-tree \
            --go "$go_binary" --rust "$rust_binary" \
            --report "$RUNNER_TEMP/cli-differential.json" --temp-root "$RUNNER_TEMP"
      - name: Run SEC-007 redaction corpus on native runner
        run: |
          cargo test --locked -p symbrowse-cli --test redaction_corpus
          go test ./internal/config ./internal/daemon ./internal/mcp ./internal/journal \
            -run 'SEC007|ConfigShowOmitsEncryptionKeyMaterial' -count=1
      - name: Verify Go daemon and session oracle
        if: runner.os != 'Windows'
        run: go test ./internal/daemon ./internal/sessionid ./cmd/symbrowse -run 'Timeout|Deadline|Cancel|Session|Registry|Autostart|Client|Engine' -count=1
      - name: Execute FETCH-011 compat protocol and lifecycle contracts
        run: python3 port/harness/run.py --suite compat-sidecar
      - name: Retain CLI comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browse-cli-${{ github.sha }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/cli-differential.json
          if-no-files-found: warn
          retention-days: 14
      - name: Test daemon contracts
        run: cargo test --manifest-path Cargo.toml -p symbrowse-daemon --test protocol_fixture --test lifecycle --test cancellation --test platform --test session_registry --locked
      - name: Compare daemon deadline, registry and autostart contracts
        run: python3 port/harness/run.py --suite daemon-contracts
      - name: Compare configuration and transport selection contracts
        run: python3 port/harness/run.py --suite config-contracts
      - name: Exercise daemon lifecycle and races
        run: |
          python3 port/harness/run.py --suite daemon
          python3 port/harness/run.py --suite daemon-races --repeat 50
      - name: Exercise static fetch, engine, and workflow contracts
        run: |
          python3 port/harness/run.py --suite fetch-control
          python3 port/harness/run.py --suite fetch-render --comparison bytes
          python3 scripts/rust-port/engine_fixture_gen.py --check
          cargo test -p symbrowse-engine --all-targets --locked
          go run ./scripts/rust-port/cmd/workflowgen --check
          cargo test -p symbrowse-core --test workflows_contract --locked
          # The Go fixture producer uses Unix sockets; Windows replays its pinned frames.
          if [[ "$RUNNER_OS" != Windows ]]; then
            go run ./scripts/rust-port/cmd/mcpfixturegen --check
          fi
          cargo test -p symbrowse-mcp --test raw_frames --locked
      - name: Verify Safari adapter and typed prerequisite contracts
        if: runner.os == 'macOS'
        run: |
          go test ./internal/engine/safari ./internal/engine/safaribidi -count=1
          cargo test -p symbrowse-engine-safari --tests --locked
          cargo test -p symbrowse-daemon --lib safari_prerequisites_report_unavailable_without_engine_substitution --locked
      - name: Exercise native Safari attach and BiDi against loopback
        if: runner.os == 'macOS'
        env:
          SYMBROWSE_NATIVE_TARGETS: "1"
        run: |
          cargo test -p symbrowse-engine-safari --test bidi --locked real_safari_bidi_launch_is_opt_in_or_reports_typed_blocked_gate -- --exact
          cargo test -p symbrowse-engine-safari --test attach --locked real_safari_attach_uses_and_closes_only_its_named_loopback_tab -- --ignored --exact
