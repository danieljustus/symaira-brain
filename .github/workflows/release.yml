name: Release

# A v* tag builds the Rust CLI on its three supported native targets, signs and
# notarizes the macOS binary, signs every asset with cosign, publishes the
# GitHub release and the Homebrew formula, then the GUI DMG and cask.
# There is no Go build and no Go fallback in any archive.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build DMG for (e.g. v0.2.2)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write # required for Cosign keyless signing

jobs:
  # Re-run the same gates as CI at tag time: a tag push does not go through
  # the branch-triggered ci.yml, so the release job must not skip them.
  test:
    name: Pre-release checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install pinned Rust audit tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked

      - name: Rust quality gate, advisories and dependency policy
        run: make rust-check

      - name: Release tooling
        run: python3 -m unittest discover -s scripts/rust-release -p 'test_*.py'

  build:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    if: github.event_name == 'push'
    strategy:
      fail-fast: true
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc floor at 2.35 for the dynamically linked CLI.
          - { os: linux, arch: amd64, runner: ubuntu-22.04 }
          - { os: linux, arch: arm64, runner: ubuntu-22.04-arm }
          - { os: darwin, arch: arm64, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Determine version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::not a SemVer tag: $tag"; exit 1; }
          {
            echo "VERSION=${tag#v}"
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
          } >> "$GITHUB_ENV"

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      # cargo-auditable embeds the locked dependency list in the binary; the
      # release job's Syft SBOM reads it (a plain Rust binary has no components).
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --version 0.7.7 --locked

      - name: Build Rust CLI
        run: SYMBRAIN_VERSION="$VERSION" cargo auditable build --locked --release -p symbrain-cli

      - name: Package and smoke-test the archive
        run: |
          set -euo pipefail
          python scripts/rust-release/package.py archive --version "$VERSION" \
            --os "${{ matrix.os }}" --arch "${{ matrix.arch }}" \
            --rust target/release/symbrain --out "$RUNNER_TEMP/dist"
          python scripts/rust-release/smoke.py --archive-dir "$RUNNER_TEMP/dist" --version "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs: [test, build]
    if: ${{ !cancelled() && needs.test.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Check if release already exists (avoid rerun deadlock)
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Manual recovery requires an explicit SemVer release tag"
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          {
            echo "VERSION=$VERSION"
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
          } >> "$GITHUB_ENV"
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "::error::Manual recovery requires an existing release at $RELEASE_TAG"
              exit 1
            fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.check_release.outputs.exists != 'true'
        with:
          pattern: release-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      - name: Import signing certificate
        if: steps.check_release.outputs.exists != 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for secret in CERTIFICATE_P12 CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!secret:-}" ]; then
              echo "::error::$secret must be configured in the release environment."
              exit 1
            fi
          done
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TEAM_ID=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*(\([A-Z0-9]*\)).*/\1/')
          if [ -z "$IDENTITY" ] || [[ ! "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::No Developer ID Application identity found."
            exit 1
          fi
          {
            echo "CODESIGN_IDENTITY=$IDENTITY"
            echo "TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Sign, notarize and repackage the darwin binary
        if: steps.check_release.outputs.exists != 'true'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          for secret in NOTARY_API_KEY NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID; do
            if [ -z "${!secret:-}" ]; then
              echo "::error::$secret must be configured in the release environment."
              exit 1
            fi
          done
          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$NOTARY_API_KEY" | base64 --decode -o "$API_KEY_PATH"
          export API_KEY_PATH
          dist="$RUNNER_TEMP/dist"
          archive="$dist/symbrain_${VERSION}_darwin_arm64.tar.gz"
          work="$RUNNER_TEMP/darwin-arm64"
          mkdir -p "$work"
          tar -xzf "$archive" -C "$work"
          codesign --force --options runtime --timestamp --identifier com.symaira.brain.cli \
            --sign "$CODESIGN_IDENTITY" "$work/symbrain"
          BIN_IDENTIFIER=com.symaira.brain.cli bash scripts/notarize-and-verify.sh \
            "$work/symbrain" bin "$RUNNER_TEMP/notary-darwin-arm64-symbrain"
          rm "$archive"
          python scripts/rust-release/package.py archive --version "$VERSION" --os darwin --arch arm64 \
            --rust "$work/symbrain" --out "$dist"
          python scripts/rust-release/package.py checksums --dir "$dist"
          python scripts/rust-release/package.py verify --version "$VERSION" --dir "$dist"

      - name: Install Syft
        if: steps.check_release.outputs.exists != 'true'
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate CycloneDX SBOMs
        if: steps.check_release.outputs.exists != 'true'
        run: |
          set -euo pipefail
          for archive in "$RUNNER_TEMP"/dist/symbrain_*.tar.gz; do
            syft "$archive" --output "cyclonedx-json=$archive.sbom.json"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["bomFormat"]=="CycloneDX" and d.get("components"), sys.argv[1]' "$archive.sbom.json"
          done

      - name: Install Cosign
        if: steps.check_release.outputs.exists != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.4.3'

      - name: Sign every asset with cosign and verify the signatures
        if: steps.check_release.outputs.exists != 'true'
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          for asset in "$RUNNER_TEMP"/dist/*; do
            cosign sign-blob --yes --output-certificate "$asset.pem" --output-signature "$asset.sig" "$asset"
            cosign verify-blob --certificate "$asset.pem" --signature "$asset.sig" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$asset"
          done

      - name: Publish the GitHub release and read it back
        if: steps.check_release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes \
            "${prerelease[@]}" "$RUNNER_TEMP"/dist/*
          readback="$(mktemp -d "$RUNNER_TEMP/release-readback.XXXXXX")"
          gh release download "$RELEASE_TAG" --pattern 'symbrain_*.tar.gz' --pattern checksums.txt --dir "$readback"
          python scripts/rust-release/package.py verify --version "$VERSION" --dir "$readback"
          cmp "$RUNNER_TEMP/dist/checksums.txt" "$readback/checksums.txt"

      - name: Publish the Homebrew formula from the published checksums
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN must be configured in the release environment."
            exit 1
          fi
          published="$(mktemp -d "$RUNNER_TEMP/published.XXXXXX")"
          gh release download "$RELEASE_TAG" --pattern checksums.txt --dir "$published"
          python scripts/rust-release/manifests.py --version "$VERSION" --checksums "$published/checksums.txt" --out "$RUNNER_TEMP/manifests"
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/danieljustus/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Formula"
          cp "$RUNNER_TEMP/manifests/symbrain.rb" "$tap/Formula/symbrain.rb"
          cd "$tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/symbrain.rb
          if git diff --cached --quiet; then
            echo "Formula already current"
            exit 0
          fi
          git commit -m "Brew formula update for symbrain version $RELEASE_TAG"
          git push

      - name: Retain notarization read-back receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-notarization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/notary-*.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

  macos-gui-dmg:
    name: macOS GUI DMG
    runs-on: macos-26
    environment: release
    needs: [release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify Xcode 26 toolchain for Icon Composer
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version | sed -n '1p')"
          echo "$XCODE_VERSION"
          case "$XCODE_VERSION" in
            Xcode\ 26.*|Xcode\ 27.*) ;;
            *) echo "::error::Expected Xcode 26 or newer, got: $XCODE_VERSION"; exit 1 ;;
          esac

      - name: Determine version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag=$TAG version=$VERSION"

      - name: Import signing certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for secret in CERTIFICATE_P12 CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!secret:-}" ]; then
              echo "::error::$secret must be configured in the release environment."
              exit 1
            fi
          done

          echo "signed=true" >> "$GITHUB_OUTPUT"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TEAM_ID=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*(\([A-Z0-9]*\)).*/\1/')
          if [ -z "$IDENTITY" ] || [[ ! "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::No Developer ID Application identity found."
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Set app version
        run: ./scripts/set-app-version.sh "${{ steps.version.outputs.version }}"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and sign GUI app
        run: |
          set -euo pipefail
          xcodebuild -project SymBrain.xcodeproj \
            -scheme SymBrain \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODESIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime"
          APP_BUNDLE=$(find build -name 'Symaira Brain.app' -type d -maxdepth 6 | head -1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "::error::App bundle not found after build"
            exit 1
          fi
          echo "APP_BUNDLE=$APP_BUNDLE" >> "$GITHUB_ENV"

      - name: Verify compiled AppIcon in release bundle
        run: |
          set -euo pipefail
          bash scripts/check-app-icons.sh --bundle "$APP_BUNDLE" --platform macOS

      - name: Notarize app bundle and create DMG
        id: dmg
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077

          APP="${{ env.APP_BUNDLE }}"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::App bundle not found"
            exit 1
          fi

          for secret in NOTARY_API_KEY NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID; do
            if [ -z "${!secret:-}" ]; then
              echo "::error::$secret must be configured in the release environment."
              exit 1
            fi
          done

          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$NOTARY_API_KEY" | base64 --decode -o "$API_KEY_PATH"

          export API_KEY_PATH
          bash scripts/notarize-and-verify.sh "$APP" app "$RUNNER_TEMP/notary-app"

          # --- Create DMG with branded drag-to-Applications window ---
          VERSION="${{ steps.version.outputs.version }}"
          DMG_PATH="$RUNNER_TEMP/Symaira-Brain-$VERSION-macos.dmg"
          DMG_STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$DMG_STAGING"
          cp -R "$APP" "$DMG_STAGING/"

          # Copy volume icon so the mounted DMG shows the Symaira Brain icon
          cp assets/app-icon/exports/AppIcon.icns "$DMG_STAGING/.VolumeIcon.icns"
          SetFile -a C "$DMG_STAGING" 2>/dev/null || true

          # Branded installer window: background, icon positions, Applications
          # link are laid out via AppleScript (same as symaira-eraseme).
          ./scripts/create-symaira-dmg.sh \
            "$DMG_STAGING/Symaira Brain.app" \
            "$DMG_PATH" \
            "Symaira Brain $VERSION"

          codesign --force --sign "$CODESIGN_IDENTITY" --timestamp "$DMG_PATH"
          bash scripts/notarize-and-verify.sh "$DMG_PATH" dmg "$RUNNER_TEMP/notary-dmg"
          {
            echo "dmg_path=$DMG_PATH"
            echo "dmg_name=Symaira-Brain-$VERSION-macos.dmg"
          } >> "$GITHUB_OUTPUT"

      - name: Retain notarization read-back receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: notarization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/notary-*.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload and independently read back GUI release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          DMG_PATH: ${{ steps.dmg.outputs.dmg_path }}
          DMG_NAME: ${{ steps.dmg.outputs.dmg_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$DMG_PATH" --clobber
          readback="$(mktemp -d "$RUNNER_TEMP/release-readback.XXXXXX")"
          gh release download "$RELEASE_TAG" --pattern "$DMG_NAME" --dir "$readback"
          cmp "$DMG_PATH" "$readback/$DMG_NAME"
          bash scripts/notarize-and-verify.sh --verify-only "$readback/$DMG_NAME" dmg

      - name: Clean up signing material
        if: always()
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP" <<'PYTHON'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          for name in ('certificate.p12', 'AuthKey.p8'):
              (root / name).unlink(missing_ok=True)
          PYTHON
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

  # ---------------------------------------------------------------------------
  # Homebrew distribution. The CLI Formula (Formula/symbrain.rb) is already
  # pushed by the `release` job; this job publishes
  # the macOS GUI as a cask (Casks/symbrain.rb) in danieljustus/homebrew-tap
  # once the signed+notarized DMG is on the release, so the tap can never point
  # at a partial release.
  # ---------------------------------------------------------------------------
  bump-homebrew:
    name: Bump Homebrew cask
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    needs: [release, macos-gui-dmg]
    steps:
      - name: Determine version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag=$TAG version=$VERSION"

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: danieljustus/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Download DMG asset and compute checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          gh release download "${TAG}" \
            --repo danieljustus/symaira-brain \
            --pattern "Symaira-Brain-${VERSION}-macos.dmg" \
            --dir artifacts
          DMG_SHA256=$(shasum -a 256 "artifacts/Symaira-Brain-${VERSION}-macos.dmg" | awk '{print $1}')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DMG_SHA256=$DMG_SHA256" >> "$GITHUB_ENV"

      - name: Write cask
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Casks
          cat > homebrew-tap/Casks/symbrain.rb <<EOF
          cask "symbrain" do
            version "${VERSION}"
            sha256 "${DMG_SHA256}"

            url "https://github.com/danieljustus/symaira-brain/releases/download/v#{version}/Symaira-Brain-#{version}-macos.dmg"
            name "Symaira Brain"
            desc "Portable agent-context layer: one MCP gateway multiplexing vault, memory, and skills for AI harnesses"
            homepage "https://github.com/danieljustus/symaira-brain"

            livecheck do
              url "https://github.com/danieljustus/symaira-brain/releases/latest"
              strategy :header_match
              regex(/Symaira-Brain-(\d+(?:\.\d+)*)-macos\.dmg/i)
            end

            depends_on macos: :sonoma

            app "Symaira Brain.app"

            zap trash: [
              "~/Library/Application Support/Symaira Brain",
              "~/Library/Preferences/com.symaira.brain.plist",
              "~/Library/Caches/com.symaira.brain",
            ]
          end
          EOF

      - name: Commit and push cask
        run: |
          set -euo pipefail
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/symbrain.rb
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Bump symbrain to v${VERSION}"
          git push
