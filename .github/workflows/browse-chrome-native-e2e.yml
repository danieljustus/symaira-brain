name: Browse Chrome native E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browse-chrome-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chrome-native:
    name: Chrome engine E2E (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
            cft: linux64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            cft: linux-arm64
          - runner: macos-15
            platform: darwin-arm64
            cft: mac-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: browse
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Fetch official Chrome for Testing artifact
        id: cft
        run: python3 port/harness/chrome_for_testing.py --platform "${{ matrix.cft }}" --destination "$RUNNER_TEMP/symbrowse-cft"

      - name: Verify sealed Chrome recording and contract fixture
        run: |
          set -euo pipefail
          python3 -B scripts/rust-port/test_browser_fixture_gen.py
          python3 port/harness/run.py --suite chrome-full

      - name: Prepare the Chrome launcher
        run: |
          set -euo pipefail
          # Ubuntu runners restrict unprivileged user namespaces, so Chrome needs
          # --no-sandbox there. The wrapper only adds that flag; every engine and
          # daemon test still launches an isolated temp profile.
          if [[ "$RUNNER_OS" == Linux ]]; then
            wrapper="$RUNNER_TEMP/symbrowse-cft/chrome-ci-wrapper"
            cat > "$wrapper" <<'SH'
          #!/usr/bin/env bash
          exec "$SYMBROWSE_CHROME_REAL_EXECUTABLE" --no-sandbox "$@"
          SH
            chmod +x "$wrapper"
            echo "SYMBROWSE_CHROME_REAL_EXECUTABLE=${{ steps.cft.outputs.executable }}" >> "$GITHUB_ENV"
            echo "SYMBROWSE_CHROME_EXECUTABLE=$wrapper" >> "$GITHUB_ENV"
          else
            echo "SYMBROWSE_CHROME_EXECUTABLE=${{ steps.cft.outputs.executable }}" >> "$GITHUB_ENV"
          fi

      - name: Run real Chrome engine E2E
        env:
          SYMBROWSE_E2E: '1'
        run: |
          set -euo pipefail
          cargo test --locked -p symbrowse-engine-chrome --test full \
            -- --exact full_chrome_surface_is_real_and_opt_in --nocapture
          cargo test --locked -p symbrowse-engine-chrome --test full \
            -- --exact blank_page_data_url_navigation_completes_and_remains_usable --nocapture
          cargo test --locked -p symbrowse-engine-chrome --test full \
            -- --exact blank_page_attaches_before_navigation_and_remains_usable --nocapture

      # RUST-012: ENG-005/006/007 through the production daemon (Unix socket) on
      # every runner, plus the frozen Go-oracle replay. The suite fails when a
      # case is skipped, missing or duplicated.
      - name: Run production-daemon Chrome suite
        env:
          SYMBROWSE_E2E: '1'
        run: python3 port/harness/run.py --suite chrome-daemon
