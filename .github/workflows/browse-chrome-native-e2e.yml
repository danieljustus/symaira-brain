name: Browse Chrome native E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browse-chrome-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chrome-native:
    name: Chrome engine E2E (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
            cft: linux64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            cft: linux-arm64
          - runner: macos-15-intel
            platform: darwin-amd64
            cft: mac-x64
          - runner: macos-15
            platform: darwin-arm64
            cft: mac-arm64
          - runner: windows-2025
            platform: windows-amd64
            cft: win64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: browse
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Fetch official Chrome for Testing artifact
        id: cft
        run: python3 port/harness/chrome_for_testing.py --platform "${{ matrix.cft }}" --destination "$RUNNER_TEMP/symbrowse-cft"

      - name: Run real Chrome engine E2E
        env:
          SYMBROWSE_E2E: '1'
          SYMBROWSE_CHROME_EXECUTABLE: ${{ steps.cft.outputs.executable }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            real_chrome="$SYMBROWSE_CHROME_EXECUTABLE"
            wrapper="$RUNNER_TEMP/symbrowse-cft/chrome-ci-wrapper"
            cat > "$wrapper" <<'SH'
          #!/usr/bin/env bash
          exec "$SYMBROWSE_CHROME_REAL_EXECUTABLE" --no-sandbox "$@"
          SH
            chmod +x "$wrapper"
            export SYMBROWSE_CHROME_REAL_EXECUTABLE="$real_chrome"
            export SYMBROWSE_CHROME_EXECUTABLE="$wrapper"
          fi
          go test ./internal/engine/chrome \
            -run '^TestNavigationLoadParityRedirectReloadAndHTTPError$' -count=1 -v
          cargo test --locked -p symbrowse-engine-chrome --test full \
            -- --exact full_chrome_surface_is_real_and_opt_in --nocapture
          cargo test --locked -p symbrowse-engine-chrome --test full \
            -- --exact blank_page_attaches_before_navigation_and_remains_usable --nocapture

      - name: Run macOS production-daemon Chrome E2E
        if: runner.os == 'macOS'
        env:
          SYMBROWSE_E2E: '1'
          SYMBROWSE_CHROME_EXECUTABLE: ${{ steps.cft.outputs.executable }}
        run: cargo test --locked -p symbrowse-daemon --test chrome_native -- --exact production_daemon_path_runs_chrome_and_reaps_owned_profile --nocapture
