name: Browse Chrome native E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browse-chrome-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chrome-native:
    name: Chrome engine E2E (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
            cft: linux64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            cft: linux-arm64
          - runner: macos-15
            platform: darwin-arm64
            cft: mac-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        working-directory: browse
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Fetch official Chrome for Testing artifact
        id: cft
        run: python3 port/harness/chrome_for_testing.py --platform "${{ matrix.cft }}" --destination "$RUNNER_TEMP/symbrowse-cft"

      - name: Verify sealed Chrome recording and contract fixture
        run: |
          set -euo pipefail
          python3 -B scripts/rust-port/test_browser_fixture_gen.py
          python3 port/harness/run.py --suite chrome-full

      - name: Prepare the Chrome launcher
        run: |
          set -euo pipefail
          # Ubuntu runners restrict unprivileged user namespaces, so Chrome needs
          # --no-sandbox there. The wrapper only adds that flag; every engine and
          # daemon test still launches an isolated temp profile.
          # The real path is written into the wrapper: tests and benchmarks
          # that clear the environment or drop SYMBROWSE_* must still work.
          if [[ "$RUNNER_OS" == Linux ]]; then
            wrapper="$RUNNER_TEMP/symbrowse-cft/chrome-ci-wrapper"
            real="${{ steps.cft.outputs.executable }}"
            printf '#!/usr/bin/env bash\nexec %q --no-sandbox "$@"\n' "$real" > "$wrapper"
            chmod +x "$wrapper"
            echo "SYMBROWSE_CHROME_EXECUTABLE=$wrapper" >> "$GITHUB_ENV"
          else
            echo "SYMBROWSE_CHROME_EXECUTABLE=${{ steps.cft.outputs.executable }}" >> "$GITHUB_ENV"
          fi

      - name: Run real Chrome engine E2E
        env:
          SYMBROWSE_E2E: '1'
        run: |
          set -euo pipefail
          cargo test --locked -p symbrowse-engine-chrome --test full \
            -- --exact full_chrome_surface_is_real_and_opt_in --nocapture
          cargo test --locked -p symbrowse-engine-chrome --test full \
            -- --exact blank_page_data_url_navigation_completes_and_remains_usable --nocapture
          cargo test --locked -p symbrowse-engine-chrome --test full \
            -- --exact blank_page_attaches_before_navigation_and_remains_usable --nocapture
          cargo test --locked -p symbrowse-engine-chrome --test launch_args -- --nocapture
          # The user path: CLI + autostarted daemon, open then read (#780).
          cargo test --locked -p symbrowse-cli --test chrome_cli_flow -- --nocapture

      # RUST-012: ENG-005/006/007 through the production daemon (Unix socket) on
      # every runner, plus the frozen Go-oracle replay. The suite fails when a
      # case is skipped, missing or duplicated.
      - name: Run production-daemon Chrome suite
        env:
          SYMBROWSE_E2E: '1'
        run: python3 port/harness/run.py --suite chrome-daemon

      - name: Run the shared daemon engine corpus against Chrome (ENG-009)
        env:
          SYMBROWSE_E2E: '1'
        run: |
          set -euo pipefail
          cargo test --locked -p symbrowse-daemon --test engine_native_corpus \
            corpus_chrome -- --nocapture 2>&1 | tee "$RUNNER_TEMP/browse-chrome-corpus.log"
          for case_id in selected-engine-version redirect cookies storage response-capture \
              capability-truth timeout cleanup; do
            grep -F "PARITY_CASE ENG-009.$case_id.chrome PASS" "$RUNNER_TEMP/browse-chrome-corpus.log"
          done

      # PERF-001..004 on an idle runner, plus the Rust real-Chrome flow that
      # replaces the Go-paired PERF-003 reference (maintainer decision
      # 2026-11-16, #780). Measurement only: the verdict is recorded from the
      # uploaded reports, so a slow runner does not fail this job.
      - name: Build the release binary for PERF measurements
        run: cargo build --release --locked -p symbrowse-cli

      - name: Measure PERF-001..004 and the Rust Chrome flow
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/browse-perf-${{ matrix.platform }}"
          mkdir -p "$out"
          binary="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')/release/symbrowse"
          base="$(mktemp -d /tmp/sbperf.XXXX)"
          python3 -B port/bench/perf_evidence.py --rust "$binary" --rounds 8 --base "$base" \
            --output "$out/perf-evidence.json"
          launcher=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            launcher=(--chrome-launcher "$SYMBROWSE_CHROME_EXECUTABLE")
          fi
          python3 -B port/bench/chrome_flow.py --rust "$binary" \
            --chrome "${{ steps.cft.outputs.executable }}" "${launcher[@]}" \
            --chrome-version "${{ steps.cft.outputs.version }}" --runs 30 \
            --output "$out/chrome-flow.json"

      - name: Upload PERF reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browse-perf-${{ matrix.platform }}
          path: ${{ runner.temp }}/browse-perf-${{ matrix.platform }}
          if-no-files-found: error
