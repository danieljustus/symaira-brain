# Bump the external symvault core's pinned version in the runtime manifest.
#
# Triggered by repository_dispatch events from symaira-vault when it publishes
# a release. The workflow updates manifest.json and opens (or updates)
# a PR so CI validates the new pin before it ships with the next
# symbrain release.
#
# Event type: core-release
# Payload:    { "core": "symvault", "tag": "v0.16.0" }
#
# --- Cross-repo dispatch setup ---
#
# Each core repo needs a step in its release workflow that sends a
# repository_dispatch event. Add this after the release is published:
#
#   notify-brain:
#     name: Notify symaira-brain
#     runs-on: ubuntu-latest
#     steps:
#       - name: Dispatch bump to symaira-brain
#         uses: peter-evans/repository-dispatch@ff450c2680634550e8dbd8260003716373f28b2f # v3.0.2
#         with:
#           token: ${{ secrets.SYMBRAIN_DISPATCH_TOKEN }}
#           repository: danieljustus/symaira-brain
#           event-type: core-release
#           client-payload: |
#             { "core": "<core-name>", "tag": "${{ github.ref_name }}" }
#
# The only accepted core name is symvault.
#
# Required secret (SYMBRAIN_DISPATCH_TOKEN):
#   - Fine-grained PAT scoped to danieljustus/symaira-brain with
#     Contents (read/write) and Pull Requests (read/write) permissions.
#   - Add the secret to each core repo under Settings → Secrets → Actions.
#   - On rotation, update the secret in the symaira-vault repository.
#
# --- Idempotency ---
#
# The workflow uses a deterministic branch name (bump/<core>/<tag>) and
# peter-evans/create-pull-request, which updates an existing PR on the
# same branch instead of creating duplicates. Re-dispatching the same
# event is safe.
#
# --- Manual test ---
#
#   gh api repos/danieljustus/symaira-brain/dispatches \
#     -f event_type=core-release \
#     -f client_payload[core]=symvault \
#     -f client_payload[tag]=v0.15.3

name: Bump Core

on:
  repository_dispatch:
    types: [core-release]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-${{ github.event.client_payload.core }}
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate payload
        id: validate
        run: |
          set -euo pipefail

          CORE="${{ github.event.client_payload.core }}"
          TAG="${{ github.event.client_payload.tag }}"

          if [ -z "$CORE" ] || [ -z "$TAG" ]; then
            echo "::error::Missing required payload fields: core, tag"
            exit 1
          fi

          # Validate core name against the remaining external core.
          case "$CORE" in
            symvault) ;;
            *)
              echo "::error::Unknown core: $CORE (expected symvault)"
              exit 1
              ;;
          esac

          # Keep dispatch validation aligned with the runtime manifest.
          if ! jq -e --arg core "$CORE" '.cores[$core] != null' internal/managed/manifest.json >/dev/null; then
            echo "::error::Core $CORE has no entry in internal/managed/manifest.json"
            exit 1
          fi

          # Validate tag format
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Invalid tag format: $TAG (expected v*.*.*)"
            exit 1
          fi

          {
            echo "core=$CORE"
            echo "tag=$TAG"
            echo "branch=bump/${CORE}/${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Compute per-asset checksums
        id: checksums
        run: |
          set -euo pipefail

          CORE="${{ steps.validate.outputs.core }}"
          TAG="${{ steps.validate.outputs.tag }}"
          REPO="danieljustus/symaira-vault"
          MANIFEST="internal/managed/manifest.json"

          # SHA256 in the manifest is keyed by exact release asset filename
          # and must be computed independently of checksums.txt (which
          # travels over the same channel as the archives and proves
          # nothing about their integrity on its own — see the SHA256
          # field doc in internal/managed/manifest.go). So: discover the
          # published archive names for this core, download each one
          # fresh, and hash the downloaded bytes ourselves.
          ASSET_PREFIX=$(jq -r --arg core "$CORE" '.cores[$core].asset_prefix' "$MANIFEST")

          echo "Listing release archives for $REPO@$TAG (prefix: $ASSET_PREFIX)..."
          mapfile -t ASSETS < <(gh release view "$TAG" --repo "$REPO" --json assets \
            -q '.assets[].name' | grep -E "^${ASSET_PREFIX}_.*\.tar\.gz\$" || true)

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::No release archives matching ${ASSET_PREFIX}_*.tar.gz found for $REPO@$TAG"
            exit 1
          fi

          echo "Found ${#ASSETS[@]} archive(s): ${ASSETS[*]}"

          SHA_JSON="{}"
          for ASSET in "${ASSETS[@]}"; do
            echo "Downloading $ASSET for independent hashing..."
            gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --output "/tmp/$ASSET" --clobber
            SUM=$(sha256sum "/tmp/$ASSET" | cut -d' ' -f1)
            echo "  $ASSET -> $SUM"
            SHA_JSON=$(jq --arg name "$ASSET" --arg sum "$SUM" '.[$name] = $sum' <<<"$SHA_JSON")
            rm -f "/tmp/$ASSET"
          done

          echo "$SHA_JSON" > /tmp/sha256_map.json

          {
            echo "sha256_map<<SHA256_MAP_EOF"
            echo "$SHA_JSON"
            echo "SHA256_MAP_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Computed checksums:"
          echo "$SHA_JSON"

      - name: Update manifest
        run: |
          set -euo pipefail

          CORE="${{ steps.validate.outputs.core }}"
          TAG="${{ steps.validate.outputs.tag }}"
          MANIFEST="internal/managed/manifest.json"

          echo "Updating $MANIFEST: $CORE -> $TAG"

          jq \
            --arg core "$CORE" \
            --arg version "$TAG" \
            --slurpfile sha /tmp/sha256_map.json \
            '.cores[$core].version = $version | .cores[$core].sha256 = $sha[0]' \
            "$MANIFEST" > "${MANIFEST}.tmp"
          mv "${MANIFEST}.tmp" "$MANIFEST"

          # Guard against ever again writing a scalar (or any non-object)
          # into .cores[$core].sha256 — Core.SHA256 is a map[string]string
          # and json.Unmarshal fails outright on a type mismatch.
          if ! jq -e --arg core "$CORE" '.cores[$core].sha256 | type == "object" and length > 0' "$MANIFEST" >/dev/null; then
            echo "::error::$MANIFEST: .cores[$CORE].sha256 is not a non-empty object after update"
            exit 1
          fi

          echo "Updated manifest:"
          jq --arg core "$CORE" '.cores[$core]' "$MANIFEST"

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(managed): bump ${{ steps.validate.outputs.core }} to ${{ steps.validate.outputs.tag }}"
          branch: ${{ steps.validate.outputs.branch }}
          title: "bump ${{ steps.validate.outputs.core }} to ${{ steps.validate.outputs.tag }}"
          body: |
            Automated bump of the pinned version for `${{ steps.validate.outputs.core }}` in the runtime manifest.

            - **Core:** `${{ steps.validate.outputs.core }}`
            - **New version:** `${{ steps.validate.outputs.tag }}`

            **Per-asset SHA-256** (independently computed by downloading and
            hashing each archive — not copied from checksums.txt):

            ```json
            ${{ steps.checksums.outputs.sha256_map }}
            ```

            This PR was created by the `bump-core` workflow triggered by a `repository_dispatch` event from the core's release workflow.

            CI will build against the new pin. Merge when green.
          labels: |
            automated
            managed-runtime
          delete-branch: true
