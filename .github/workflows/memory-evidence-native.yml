name: Memory evidence native parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'rust/symbrain-memory/**'
      - 'scripts/memory-evidence-oracle/**'
      - '.github/workflows/memory-evidence-native.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
  push:
    branches: [main]
    paths:
      - 'rust/symbrain-memory/**'
      - 'scripts/memory-evidence-oracle/**'
      - '.github/workflows/memory-evidence-native.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'

permissions:
  contents: read

jobs:
  evidence:
    name: memory evidence (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
      - name: Run immutable production Go contracts
        env:
          REPORT: ${{ runner.temp }}/memory-evidence-go.json
        run: |
          set -euo pipefail
          umask 022
          scripts/memory-evidence-oracle/run.sh --report "$REPORT"
      - name: Require real replay failure controls
        env:
          REPORT: ${{ runner.temp }}/memory-evidence-controls.json
        run: |
          set -euo pipefail
          umask 022
          python3 scripts/memory-evidence-oracle/controls.py --report "$REPORT"
      - name: Verify native memory contracts and lint
        env:
          TEST_LOG: ${{ runner.temp }}/memory-evidence-rust-tests.log
          CLIPPY_LOG: ${{ runner.temp }}/memory-evidence-rust-clippy.log
        run: |
          set -euo pipefail
          umask 022
          cargo fmt --all -- --check
          cargo test -p symbrain-memory --all-targets --all-features --locked 2>&1 | tee "$TEST_LOG"
          cargo clippy -p symbrain-memory --all-targets --all-features --locked -- -D warnings 2>&1 | tee "$CLIPPY_LOG"
      - name: Record exact native head and SDK
        if: always()
        env:
          RECEIPT: ${{ runner.temp }}/memory-evidence-native.txt
        run: |
          set -euo pipefail
          umask 022
          {
            echo "source_revision=$GITHUB_SHA"
            echo "runner=${{ matrix.runner }}"
            rustc -Vv
            cargo -V
            go version
          } > "$RECEIPT"
      - name: Retain acceptance receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memory-evidence-${{ matrix.runner }}-${{ github.sha }}
          path: ${{ runner.temp }}/memory-evidence-*
          if-no-files-found: error
          retention-days: 14
