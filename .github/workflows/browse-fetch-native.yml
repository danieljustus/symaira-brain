name: Browse honest fetch native contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'browse/**'
      - '.github/workflows/browse-fetch-native.yml'
  push:
    branches: [main]
    paths:
      - 'browse/**'
      - '.github/workflows/browse-fetch-native.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  fetch-contract:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: browse
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Test honest fetch and original controls
        run: |
          set -euo pipefail
          umask 022
          cargo test -p symbrowse-fetch --all-targets --locked 2>&1 | tee "$RUNNER_TEMP/browse-fetch-tests.log"
          python3 scripts/rust-port/test_benchmark_harness.py
          python3 port/bench/test_identity.py
      - name: Prove actual deadline and owner-lifetime negative controls
        run: |
          set -euo pipefail
          umask 022
          cargo test -p symbrowse-fetch --all-targets --locked --no-run --message-format=json > "$RUNNER_TEMP/browse-fetch-deadline-artifacts.jsonl" 2> "$RUNNER_TEMP/browse-fetch-deadline-build.log"
          python3 port/harness/fetch_deadline_controls.py --artifacts "$RUNNER_TEMP/browse-fetch-deadline-artifacts.jsonl" --output "$RUNNER_TEMP/browse-fetch-deadline-controls.json" 2>&1 | tee "$RUNNER_TEMP/browse-fetch-deadline-controls.log"

      - name: Verify native honest fetch lint
        run: |
          cargo clippy -p symbrowse-fetch --all-targets --all-features --locked -- -D warnings
          cargo fmt --all --check
      - name: Upload exact-head native fetch proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browse-fetch-${{ matrix.runner }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/browse-fetch-tests.log
            ${{ runner.temp }}/browse-fetch-deadline-artifacts.jsonl
            ${{ runner.temp }}/browse-fetch-deadline-build.log
            ${{ runner.temp }}/browse-fetch-deadline-controls.json
            ${{ runner.temp }}/browse-fetch-deadline-controls.log
          if-no-files-found: error
          retention-days: 14
