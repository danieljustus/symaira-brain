version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/browse"
      - "/fuzz"
      - "/browse/fuzz"
    schedule:
      interval: "weekly"
    ignore:
      # The pinned CoreKit requires serde_json =1.0.151, so any newer version
      # fails to resolve. Remove after danieljustus/symaira-corekit#475.
      - dependency-name: "serde_json"
    groups:
      # CoreKit crates share one Git tag; bump them together. Dependabot only
      # bumps CoreKit pins written as `tag = "vX.Y.Z"`, never `rev = "<sha>"`.
      symaira-corekit:
        patterns:
          - "symaira-core-*"
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # CoreKit Swift pins. "/" covers SymBrain.xcodeproj (project.pbxproj +
  # Package.resolved); Dependabot never edits project.yml, so a bump PR must
  # also update its exactVersion (scripts/check-corekit-pins.sh enforces it).
  - package-ecosystem: "swift"
    directories:
      - "/"
      - "/operate"
      - "/scope"
    schedule:
      interval: "weekly"
    groups:
      symaira-corekit:
        patterns:
          - "*symaira-corekit*"
