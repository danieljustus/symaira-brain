[package]
name = "symbrowse-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "symbrowse"
path = "src/main.rs"

[dependencies]
html5ever.workspace = true
markup5ever_rcdom.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
symbrowse-core = { path = "../symbrowse-core", version = "=0.0.0" }
symbrowse-engine.workspace = true
symbrowse-daemon = { path = "../symbrowse-daemon", version = "=0.0.0" }
symbrowse-mcp = { path = "../symbrowse-mcp", version = "=0.0.0" }
symbrowse-protocol.workspace = true
symaira-cutover = { path = "../../../rust/symaira-cutover", version = "=0.13.0" }
time.workspace = true
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
tempfile = "=3.27.0"
