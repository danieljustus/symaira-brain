[package]
name = "fetch002-primp-wire-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
base64 = "=0.22.1"
hpack = "=0.3.0"
primp = { version = "=2.0.1", default-features = false }
rcgen = { version = "=0.14.5", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }
